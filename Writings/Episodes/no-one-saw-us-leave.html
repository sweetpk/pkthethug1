<!DOCTYPE html>
<html lang="en" data-theme="night" data-mood="august" data-size="m">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>No One Saw Us Leave — A Class XII Story</title>
<link rel="icon" type="image/png" href="../../assets/images/PK-Logo-Light.png" />
<link rel="apple-touch-icon" href="../../assets/images/PK-Logo-Light.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --prose-size: 1.13rem;
    --prose-lh: 1.8;
    --max-width: 690px;
    --radius-lg: 15px;
    --radius-md: 11px;
    --radius-sm: 7px;
    --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  [data-size="s"] { --prose-size: 1.01rem; --prose-lh: 1.72; }
  [data-size="m"] { --prose-size: 1.13rem; --prose-lh: 1.8; }
  [data-size="l"] { --prose-size: 1.26rem; --prose-lh: 1.85; }

  /* Theme: Sodium Fog (Chandigarh Sector 44 winter dusk / sodium streetlight) */
  [data-theme="night"] {
    --bg-base: #0a0c10;
    --bg-grad-1: #1c1718;
    --bg-grad-2: #07080b;
    --surface: rgba(17, 20, 27, 0.9);
    --surface-solid: #12151d;
    --surface-elevated: rgba(25, 29, 39, 0.95);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(217, 155, 78, 0.36);
    --text-main: #eae4d8;
    --text-soft: #b6afa2;
    --text-muted: #7b8494;
    --accent: #d99b4e;
    --accent-soft: rgba(217, 155, 78, 0.13);
    --accent-glow: rgba(217, 155, 78, 0.2);
    --danger: #c95b4c;
    --danger-soft: rgba(201, 91, 76, 0.14);
    --cold: #7a9ab8;
    --cold-soft: rgba(122, 154, 184, 0.12);
    --chat-bg: #0d1118;
    --chat-me: #1b362f;
    --chat-them: #181f2b;
    --ledger-bg: #14171f;
    --shadow: 0 22px 54px rgba(0, 0, 0, 0.62);
  }

  /* Theme: Ruled Register (Classmate notebook / police diary paper) */
  [data-theme="paper"] {
    --bg-base: #f1ebe0;
    --bg-grad-1: #e6dccb;
    --bg-grad-2: #f6f2e9;
    --surface: rgba(251, 248, 241, 0.94);
    --surface-solid: #faf6ed;
    --surface-elevated: #ffffff;
    --border: rgba(34, 28, 22, 0.12);
    --border-strong: rgba(164, 74, 42, 0.42);
    --text-main: #1f1b16;
    --text-soft: #483f35;
    --text-muted: #7d7265;
    --accent: #9e541c;
    --accent-soft: rgba(158, 84, 28, 0.1);
    --accent-glow: rgba(158, 84, 28, 0.15);
    --danger: #a8382b;
    --danger-soft: rgba(168, 56, 43, 0.1);
    --cold: #355878;
    --cold-soft: rgba(53, 88, 120, 0.1);
    --chat-bg: #e7dfd0;
    --chat-me: #d2e8d5;
    --chat-them: #ffffff;
    --ledger-bg: #f6f0e2;
    --shadow: 0 18px 46px rgba(42, 30, 18, 0.1);
  }

  /* Mood backdrop shifts */
  [data-theme="night"][data-mood="august"] {
    --bg-grad-1: #1f1a15;
    --bg-grad-2: #0a0c11;
  }
  [data-theme="night"][data-mood="flat402"] {
    --bg-grad-1: #231815;
    --bg-grad-2: #08090d;
  }
  [data-theme="night"][data-mood="october"] {
    --bg-grad-1: #221417;
    --bg-grad-2: #090b10;
  }
  [data-theme="night"][data-mood="december_fog"] {
    --bg-grad-1: #131a24;
    --bg-grad-2: #06080c;
  }
  [data-theme="night"][data-mood="inquiry"] {
    --bg-grad-1: #14191e;
    --bg-grad-2: #07090c;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg-base);
    color: var(--text-main);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--font-sans);
    background:
      radial-gradient(ellipse 92% 58% at 50% 0%, var(--bg-grad-1), transparent 74%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-grad-2) 100%);
    color: var(--text-main);
    overflow-x: hidden;
    transition: background 0.9s ease, color 0.35s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }

  #ambient-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.54;
    transition: opacity 0.8s ease;
  }
  [data-theme="paper"] #ambient-canvas { opacity: 0.25; }
  body.reduced-motion #ambient-canvas { display: none; }

  /* Top Sticky Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg-base) 84%, transparent);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  }
  .topbar.hidden { display: none; }
  .topbar-inner {
    max-width: 840px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .scene-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .scene-chapter {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scene-location {
    font-family: var(--font-mono);
    font-size: 0.69rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    border-radius: 10px;
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-sans);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover {
    border-color: var(--border-strong);
    color: var(--text-main);
    background: var(--surface-elevated);
  }
  .icon-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .icon-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .btn-label { display: inline; }
  @media (max-width: 620px) {
    .btn-label { display: none; }
    .icon-btn { padding: 0 8px; }
  }

  .progress-track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: transparent;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--danger));
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* App Shell */
  .app-shell {
    position: relative;
    z-index: 2;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 24px 20px 88px;
  }

  /* Title Screen */
  .title-screen {
    min-height: calc(100dvh - 52px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 28px 12px;
    animation: fadeUp 0.7s ease both;
  }
  .title-kicker {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--accent-soft);
  }
  .title-main {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(2.35rem, 6.8vw, 3.95rem);
    line-height: 1.06;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    color: var(--text-main);
  }
  .title-main em {
    font-style: italic;
    color: var(--danger);
  }
  .title-sub {
    font-family: var(--font-serif);
    font-size: clamp(1.03rem, 2.5vw, 1.2rem);
    line-height: 1.65;
    color: var(--text-soft);
    max-width: 545px;
    margin: 0 0 22px;
  }
  .title-warning {
    font-size: 0.79rem;
    color: var(--text-muted);
    max-width: 480px;
    line-height: 1.56;
    margin: 0 0 26px;
    padding: 11px 15px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    background: var(--surface);
    text-align: left;
  }
  .title-warning strong {
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 0.71rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }
  .title-cta-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    width: 100%;
    max-width: 340px;
  }
  .primary-btn {
    width: 100%;
    appearance: none;
    border: none;
    border-radius: var(--radius-md);
    padding: 15px 24px;
    font-family: var(--font-sans);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #b86b28);
    color: #140f0a;
    box-shadow: 0 10px 28px var(--accent-glow);
    transition: transform 0.2s ease, filter 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .primary-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .primary-btn:active { transform: translateY(0); }

  .secondary-btn {
    width: 100%;
    appearance: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 20px;
    font-family: var(--font-sans);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-main);
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .secondary-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-elevated);
  }
  .title-meta-row {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 16px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .title-controls {
    margin-top: 18px;
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Chapter Banner */
  .chapter-banner {
    margin: 8px 0 24px;
    padding: 20px 22px;
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-align: center;
    animation: fadeUp 0.45s ease both;
  }
  .chapter-banner-num {
    font-family: var(--font-mono);
    font-size: 0.71rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .chapter-banner-title {
    font-family: var(--font-serif);
    font-size: clamp(1.42rem, 4vw, 1.92rem);
    font-weight: 500;
    margin: 0;
    line-height: 1.24;
  }
  .chapter-banner-sub {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.06em;
  }

  /* Story Card */
  .story-stage { animation: fadeUp 0.36s ease both; }
  .story-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: clamp(22px, 4.5vw, 38px) clamp(20px, 5vw, 40px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .scene-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.71rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .scene-tag::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  [data-mood="december_fog"] .scene-tag::before,
  [data-mood="inquiry"] .scene-tag::before {
    background: var(--danger);
    box-shadow: 0 0 10px var(--danger);
  }

  .prose-block {
    font-family: var(--font-serif);
    font-size: var(--prose-size);
    line-height: var(--prose-lh);
    color: var(--text-main);
    margin: 0 0 1.22em;
    letter-spacing: 0.002em;
  }
  .prose-block:last-child { margin-bottom: 0; }
  .prose-block em { color: color-mix(in srgb, var(--text-main) 88%, var(--accent)); }
  .prose-block strong { font-weight: 600; color: var(--text-main); }

  .prose-quote {
    margin: 1.3em 0;
    padding: 4px 0 4px 18px;
    border-left: 2px solid var(--danger);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: calc(var(--prose-size) * 1.01);
    line-height: var(--prose-lh);
    color: var(--text-soft);
  }

  .scene-divider {
    text-align: center;
    margin: 24px 0;
    color: var(--accent);
    letter-spacing: 0.45em;
    font-size: 0.88rem;
    opacity: 0.7;
    user-select: none;
  }

  /* WhatsApp / Locked Chat Widget */
  .chat-card {
    margin: 22px 0;
    border-radius: var(--radius-md);
    background: var(--chat-bg);
    border: 1px solid var(--border);
    overflow: hidden;
    font-family: var(--font-sans);
  }
  .chat-card.locked-chat {
    border-color: rgba(201, 91, 76, 0.35);
  }
  .chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface-solid) 92%, transparent);
  }
  .chat-head-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--danger));
    color: #140f0a;
    font-weight: 700;
    font-size: 0.79rem;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .chat-name { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
  .chat-status { font-size: 0.7rem; color: var(--text-muted); }
  .chat-lock-pill {
    font-family: var(--font-mono);
    font-size: 0.63rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid rgba(201, 91, 76, 0.32);
  }
  .chat-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .chat-day-pill {
    align-self: center;
    font-family: var(--font-mono);
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    margin: 4px 0;
  }
  .bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.46;
    color: var(--text-main);
    word-break: break-word;
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--chat-them);
    border-bottom-left-radius: 3px;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--chat-me);
    border-bottom-right-radius: 3px;
  }
  .bubble.deleted {
    font-style: italic;
    color: var(--text-muted);
    font-size: 0.83rem;
  }
  .bubble.view-once {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    border: 1px dashed var(--border-strong);
    color: var(--accent);
  }
  .bubble-sender {
    display: block;
    font-size: 0.69rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .bubble-time {
    display: block;
    margin-top: 3px;
    font-size: 0.64rem;
    opacity: 0.62;
    text-align: right;
    font-family: var(--font-mono);
  }

  /* Coaching Attendance SMS / Lockscreen Notifications */
  .prop-sms {
    margin: 20px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    background: var(--surface-elevated);
    padding: 13px 16px;
    font-family: var(--font-mono);
  }
  .prop-sms-head {
    display: flex;
    justify-content: space-between;
    font-size: 0.67rem;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .prop-sms-body {
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--text-main);
  }

  /* Gate 2 Security Register */
  .prop-register {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--ledger-bg);
    padding: 14px 16px;
    font-family: var(--font-mono);
    overflow-x: auto;
  }
  .prop-register-title {
    font-size: 0.69rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  .register-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.76rem;
  }
  .register-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 0.67rem;
  }
  .register-table td {
    padding: 7px 8px;
    border-bottom: 1px dashed var(--border);
    color: var(--text-soft);
  }
  .register-table tr.highlight-row td {
    color: var(--danger);
    font-weight: 600;
    background: var(--danger-soft);
  }

  /* Police / School Inquiry Statement Box */
  .prop-statement {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid rgba(201, 91, 76, 0.38);
    background: var(--surface-elevated);
    padding: 16px 18px;
    font-family: var(--font-mono);
  }
  .prop-statement-head {
    font-size: 0.69rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--danger);
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .prop-statement-body {
    font-size: 0.83rem;
    line-height: 1.62;
    color: var(--text-main);
  }

  /* Lockscreen Alert Stack */
  .prop-lockscreen {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--chat-bg) 92%, black);
    padding: 14px;
    font-family: var(--font-sans);
  }
  .prop-lockscreen-time {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .notif-stack {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .notif-item {
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .notif-item.urgent {
    border-color: rgba(201, 91, 76, 0.42);
    background: var(--danger-soft);
  }
  .notif-sender {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-main);
  }
  .notif-text {
    font-size: 0.81rem;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .notif-when {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* Choices Section */
  .choices-wrap {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeUp 0.4s 0.05s ease both;
  }
  .choice-btn {
    width: 100%;
    text-align: left;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 18px;
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(10px);
  }
  .choice-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-elevated);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  }
  .choice-btn:active { transform: scale(0.994); }
  .choice-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    margin-top: 1px;
    border-radius: 7px;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.74rem;
    font-weight: 600;
    display: grid;
    place-items: center;
  }
  .choice-title {
    font-family: var(--font-sans);
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-main);
  }

  .below-choices {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .text-link-btn {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    cursor: pointer;
    padding: 6px 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s ease;
  }
  .text-link-btn:hover { color: var(--accent); }
  .text-link-btn:disabled { opacity: 0.35; pointer-events: none; }

  /* Immediate Consequence View */
  .picked-choice {
    margin: 0 0 22px;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    border-left: 3px solid var(--danger);
    background: var(--danger-soft);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .picked-label {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--danger);
    margin-right: 10px;
    font-weight: 600;
  }
  .continue-btn {
    justify-content: space-between;
    align-items: center;
    border-color: var(--border-strong);
    background: var(--accent-soft);
  }
  .continue-btn:hover {
    background: var(--surface-solid);
    border-color: var(--accent);
  }

  /* Ending Card */
  .ending-card {
    margin-top: 24px;
    padding: 28px 24px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, var(--danger-soft), var(--surface));
    border: 1px solid rgba(201, 91, 76, 0.45);
    text-align: center;
    animation: fadeUp 0.55s ease both;
  }
  .ending-badge {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .ending-title {
    font-family: var(--font-serif);
    font-size: clamp(1.55rem, 4.4vw, 2.15rem);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .ending-subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--text-soft);
    margin: 0 0 22px;
    font-size: 1.02rem;
    line-height: 1.52;
  }
  .recap-box {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin: 0 0 16px;
  }
  .recap-title {
    font-family: var(--font-mono);
    font-size: 0.71rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .domino-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .domino-item {
    font-size: 0.87rem;
    line-height: 1.5;
    color: var(--text-soft);
    padding-left: 12px;
    border-left: 2px solid var(--danger);
  }
  .domino-item strong {
    display: block;
    color: var(--text-main);
    font-size: 0.84rem;
    margin-bottom: 2px;
  }
  .ending-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 18px;
  }
  .ending-actions button { width: auto; min-width: 165px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 10, 0.76);
    backdrop-filter: blur(6px);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-panel {
    width: 100%;
    max-width: 590px;
    max-height: 86dvh;
    overflow-y: auto;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 22px 26px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.25s ease both;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title {
    font-family: var(--font-serif);
    font-size: 1.32rem;
    font-weight: 500;
    margin: 0;
  }
  .modal-section-label {
    font-family: var(--font-mono);
    font-size: 0.69rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 18px 0 9px;
  }
  .ending-grid { display: grid; gap: 8px; }
  .ending-item {
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .ending-item.unlocked {
    border-color: rgba(201, 91, 76, 0.45);
    background: var(--danger-soft);
  }
  .ending-item-head {
    font-size: 0.89rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 3px;
  }
  .ending-item-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .notes-list {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.86rem;
    line-height: 1.48;
    color: var(--text-soft);
  }
  .replay-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .pill-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-main);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.79rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .pill-btn:hover {
    border-color: var(--border-strong);
    color: var(--accent);
  }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.81rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    z-index: 80;
    transition: opacity 0.24s ease, transform 0.24s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .app-shell { padding: 14px 12px 74px; }
    .story-card { padding: 20px 17px; }
    .choice-btn { padding: 13px 14px; gap: 11px; }
    .choice-title { font-size: 0.92rem; }
  }
</style>
</head>
<body>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

        <svg id="audio-icon-on" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>

        <span style="font-family:var(--font-serif);font-weight:600">Aa</span>
      </button>
      <button id="btn-theme" class="icon-btn" title="Switch Theme (Sodium Fog / Ruled Register)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>

      </button>

  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>

<main id="app" class="app-shell"></main>

<div id="journal-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">Traces Left Behind &amp; Timelines</h2>
      <button id="btn-close-modal" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>

<div id="toast" class="toast"></div>

<script>
(() => {
  "use strict";

  const SAVE_KEY = "no_one_saw_us_leave_save_v1";
  const META_KEY = "no_one_saw_us_leave_meta_v1";

  const ENDINGS_CATALOG = [
    {
      id: "ending_1",
      num: "I",
      title: "Roll Number 14",
      desc: "You wiped the phones, tore the page from Bahadur's register, slipped out through the Sector 44 service lane before 1:30 AM, and sat for your Physics board paper in March with a spotless file."
    },
    {
      id: "ending_2",
      num: "II",
      title: "Alibi for Two",
      desc: "You and Meher held the exact same rehearsed lie inside Sector 36 Police Station. Nobody went to jail, and neither of you can ever look at the other without seeing the second-floor concrete ledge."
    },
    {
      id: "ending_3",
      num: "III",
      title: "What Simran Handed Over",
      desc: "You tried to play the reluctant, decent topper one last time in front of the SHO—until the digital trail and the people you cornered in October cracked your statement open in front of your father."
    },
    {
      id: "ending_4",
      num: "IV",
      title: "Two Minutes Silence at Assembly",
      desc: "When the wall caved in on December 20, you threw Meher to the wolves to keep Harsh from breaking your face. Three weeks later, the principal handed you the microphone to read her condolence prayer."
    },
    {
      id: "ending_5",
      num: "V",
      title: "Dial 108 From Your Own Phone",
      desc: "You refused to run down the back stairs or wipe the handset. You lost your board year, your father's savings, and your clean name, and kept the only pair of unhid eyes left in the room."
    },
    {
      id: "ending_6",
      num: "VI",
      title: "Statement Under Section 164",
      desc: "You took the physical blow on the terrace to shield her and tried to carry the cover-up—only for her family's counsel to sign your name onto every single charge before the winter session closed."
    },
    {
      id: "ending_7",
      num: "VII",
      title: "CH-01-BM-4418 Under Dust",
      desc: "Six months of playing peacemaker while stealing from both of them left Harsh in a PGI neuro-ward and Meher gone from the city. His black Activa is still chained to the Sector 34 pipe in February."
    }
  ];

  function freshState() {
    return {
      harshTrust: 10,
      harshSuspicion: 0,
      meherAttachment: 2,
      meherDesperation: 1,
      guilt: 0,
      coverDepth: 0,
      academicStanding: 8,
      flags: {},
      traces: [],
      dominoes: [],
      wordsRead: 0
    };
  }

  function addTrace(s, text) {
    if (!s.traces.includes(text)) s.traces.push(text);
  }

  function addDomino(s, chapter, choice, ripple) {
    if (!s.dominoes.some(d => d.choice === choice)) {
      s.dominoes.push({ chapter, choice, ripple });
    }
  }

  function cloneState(s) {
    return JSON.parse(JSON.stringify(s));
  }

  function loadMeta() {
    try {
      const raw = localStorage.getItem(META_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { unlockedEndings: [], theme: "night", size: "m", reducedMotion: false };
  }

  function saveMeta(m) {
    try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (_) {}
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && STORY[parsed.sceneId]) return parsed;
      }
    } catch (_) {}
    return null;
  }

  function writeSave() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        sceneId: runtime.sceneId,
        state: runtime.state,
        history: runtime.history.slice(-60),
        lastChapterBanner: runtime.lastChapterBanner,
        reaction: runtime.reaction
      }));
    } catch (_) {}
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
  }

  const meta = loadMeta();
  document.documentElement.setAttribute("data-theme", meta.theme || "night");
  document.documentElement.setAttribute("data-size", meta.size || "m");
  if (meta.reducedMotion) document.body.classList.add("reduced-motion");

  const runtime = {
    view: "title",
    sceneId: "c1_assembly",
    state: freshState(),
    history: [],
    lastChapterBanner: 0,
    currentChoices: [],
    reaction: null
  };

  /* ---------------- Web Audio Adaptive Chandigarh Ambience ---------------- */
  const ambientAudio = {
    ctx: null,
    master: null,
    filter: null,
    humOsc: null,
    humGain: null,
    playing: false,
    toggle() {
      if (this.playing) { this.stop(); return false; }
      this.start();
      return true;
    },
    start() {
      try {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          const bufferSize = this.ctx.sampleRate * 3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.997 * b0 + white * 0.026;
            b1 = 0.985 * b1 + white * 0.030;
            b2 = 0.950 * b2 + white * 0.042;
            data[i] = (b0 + b1 + b2 + white * 0.055) * 0.42;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;

          this.filter = this.ctx.createBiquadFilter();
          this.filter.type = "lowpass";
          this.filter.frequency.value = 540;

          this.master = this.ctx.createGain();
          this.master.gain.value = 0.0001;

          /* Subtle low sodium-lamp / ceiling-fan drone */
          this.humOsc = this.ctx.createOscillator();
          this.humOsc.type = "sine";
          this.humOsc.frequency.value = 55;
          this.humGain = this.ctx.createGain();
          this.humGain.gain.value = 0.015;

          src.connect(this.filter);
          this.filter.connect(this.master);
          this.humOsc.connect(this.humGain);
          this.humGain.connect(this.master);
          this.master.connect(this.ctx.destination);

          src.start();
          this.humOsc.start();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
        this.playing = true;
        this.setMood(document.documentElement.getAttribute("data-mood") || "august");
      } catch (_) {
        showToast("Audio unavailable in this browser.");
      }
    },
    stop() {
      if (this.ctx && this.master) {
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.4);
      }
      this.playing = false;
    },
    setMood(mood) {
      if (!this.ctx || !this.filter || !this.playing) return;
      const freqMap = {
        august: 880,
        flat402: 360,
        october: 440,
        december_fog: 260,
        inquiry: 620
      };
      const gainMap = {
        august: 0.16,
        flat402: 0.11,
        october: 0.12,
        december_fog: 0.18,
        inquiry: 0.09
      };
      const humMap = {
        august: 58,
        flat402: 50,
        october: 52,
        december_fog: 44,
        inquiry: 100
      };
      const t = this.ctx.currentTime;
      this.filter.frequency.linearRampToValueAtTime(freqMap[mood] || 440, t + 1.0);
      this.master.gain.linearRampToValueAtTime(gainMap[mood] || 0.12, t + 1.0);
      if (this.humOsc) {
        this.humOsc.frequency.linearRampToValueAtTime(humMap[mood] || 52, t + 1.0);
      }
    }
  };

  /* ---------------- Mood-Responsive Particle & Light-Slats Canvas ---------------- */
  (() => {
    const canvas = document.getElementById("ambient-canvas");
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1;
    const particles = [];
    const COUNT = 68;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.9 + Math.random() * 1.9,
        len: 11 + Math.random() * 18,
        speed: 3.5 + Math.random() * 6.5,
        drift: (Math.random() - 0.5) * 0.42,
        alpha: 0.06 + Math.random() * 0.17
      });
    }

    function tick() {
      if (!document.body.classList.contains("reduced-motion")) {
        ctx.clearRect(0, 0, w, h);
        const mood = document.documentElement.getAttribute("data-mood") || "august";
        const isPaper = document.documentElement.getAttribute("data-theme") === "paper";

        if (mood === "august") {
          ctx.lineWidth = 1;
          for (let i = 0; i < COUNT; i++) {
            const p = particles[i];
            ctx.strokeStyle = isPaper
              ? `rgba(100,82,66,${p.alpha * 0.55})`
              : `rgba(190,208,228,${p.alpha * 0.85})`;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - 1.3, p.y + p.len);
            ctx.stroke();
            p.x -= 0.7;
            p.y += p.speed * 0.92;
            if (p.y > h + 20) { p.y = -25; p.x = Math.random() * (w + 50); }
          }
        } else if (mood === "flat402") {
          /* Slatted afternoon blind bars + slow dust motes */
          if (!isPaper) {
            ctx.fillStyle = "rgba(217, 155, 78, 0.018)";
            for (let s = 0; s < 5; s++) {
              ctx.fillRect(0, h * (0.14 + s * 0.16), w, 26);
            }
          }
          for (let i = 0; i < 34; i++) {
            const p = particles[i];
            ctx.fillStyle = isPaper
              ? `rgba(130,86,44,${p.alpha * 0.5})`
              : `rgba(226,174,104,${p.alpha * 0.75})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            p.x += p.drift * 0.6;
            p.y -= 0.15;
            if (p.y < -10) p.y = h + 10;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
          }
        } else {
          /* Fog / dust drift */
          const count = mood === "december_fog" ? 46 : 28;
          for (let i = 0; i < count; i++) {
            const p = particles[i];
            const rad = mood === "december_fog" ? p.r * 1.65 : p.r;
            ctx.fillStyle = isPaper
              ? `rgba(110,75,60,${p.alpha * 0.45})`
              : mood === "december_fog"
                ? `rgba(182,198,218,${p.alpha * 0.55})`
                : `rgba(209,112,92,${p.alpha * 0.55})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
            ctx.fill();
            p.x += p.drift * (mood === "december_fog" ? 1.25 : 0.8);
            p.y += mood === "december_fog" ? 0.22 : -0.14;
            if (p.y < -10) p.y = h + 10;
            if (p.y > h + 10) p.y = -10;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
          }
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatRich(str) {
    return String(str);
  }

  function countWordsInBlocks(blocks) {
    let words = 0;
    for (const b of blocks || []) {
      if (b.text) words += b.text.replace(/<[^>]+>/g, "").trim().split(/\s+/).length;
      if (b.messages) {
        for (const m of b.messages) words += (m.text || "").trim().split(/\s+/).length;
      }
      if (b.data && b.data.body) words += b.data.body.replace(/<[^>]+>/g, "").trim().split(/\s+/).length;
    }
    return words;
  }

  function renderBlock(b) {
    if (!b) return "";
    if (b.type === "p") {
      return `<p class="prose-block">${formatRich(b.text)}</p>`;
    }
    if (b.type === "quote") {
      return `<blockquote class="prose-quote">${formatRich(b.text)}</blockquote>`;
    }
    if (b.type === "divider") {
      return `<div class="scene-divider" aria-hidden="true">· · ·</div>`;
    }
    if (b.type === "chat") {
      const msgs = (b.messages || []).map(m => {
        if (m.day) return `<div class="chat-day-pill">${escapeHtml(m.day)}</div>`;
        const cls = m.from === "me" ? "me" : "them";
        const deletedCls = m.deleted ? " deleted" : "";
        const viewOnceCls = m.viewOnce ? " view-once" : "";
        const ticks = m.from === "me" ? (m.singleTick ? " ✓" : " ✓✓") : "";
        return `
          <div class="bubble ${cls}${deletedCls}${viewOnceCls}">
            ${m.sender ? `<span class="bubble-sender">${escapeHtml(m.sender)}</span>` : ""}
            ${escapeHtml(m.text)}
            ${m.time ? `<span class="bubble-time">${escapeHtml(m.time)}${ticks}</span>` : ""}
          </div>`;
      }).join("");
      const lockBadge = b.locked
        ? `<span class="chat-lock-pill">🔒 ${escapeHtml(b.lockLabel || "Locked Chat")}</span>`
        : "";
      return `
        <div class="chat-card ${b.locked ? "locked-chat" : ""}">
          <div class="chat-head">
            <div class="chat-head-left">
              <div class="chat-avatar">${escapeHtml((b.header || "M")[0])}</div>
              <div>
                <div class="chat-name">${escapeHtml(b.header || "Chat")}</div>
                <div class="chat-status">${escapeHtml(b.status || "online")}</div>
              </div>
            </div>
            ${lockBadge}
          </div>
          <div class="chat-body">${msgs}</div>
        </div>`;
    }
    if (b.type === "prop") {
      const d = b.data || {};
      if (b.kind === "sms") {
        return `
          <div class="prop-sms">
            <div class="prop-sms-head">
              <span>${escapeHtml(d.sender || "AD-APEXCH")}</span>
              <span>${escapeHtml(d.time || "")}</span>
            </div>
            <div class="prop-sms-body">${formatRich(d.body || "")}</div>
          </div>`;
      }
      if (b.kind === "register") {
        const rowsHtml = (d.rows || []).map(r => `
          <tr class="${r.highlight ? "highlight-row" : ""}">
            <td>${escapeHtml(r.date || "")}</td>
            <td>${escapeHtml(r.flat || "")}</td>
            <td>${escapeHtml(r.name || "")}</td>
            <td>${escapeHtml(r.timeIn || "")}</td>
            <td>${escapeHtml(r.timeOut || "")}</td>
          </tr>`).join("");
        return `
          <div class="prop-register">
            <div class="prop-register-title">
              <span>${escapeHtml(d.title || "SHIVALIK ENCLAVE · GATE 2 REGISTER")}</span>
              <span>${escapeHtml(d.page || "PG. 114")}</span>
            </div>
            <table class="register-table">
              <thead>
                <tr><th>DATE</th><th>FLAT</th><th>VISITOR</th><th>IN</th><th>OUT</th></tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>`;
      }
      if (b.kind === "statement") {
        return `
          <div class="prop-statement">
            <div class="prop-statement-head">
              <span>${escapeHtml(d.title || "SECTOR 36 POLICE STATION · GENERAL DIARY")}</span>
              <span>${escapeHtml(d.ref || "")}</span>
            </div>
            <div class="prop-statement-body">${formatRich(d.body || "")}</div>
          </div>`;
      }
      if (b.kind === "lockscreen") {
        const itemsHtml = (d.items || []).map(it => `
          <div class="notif-item ${it.urgent ? "urgent" : ""}">
            <div>
              <div class="notif-sender">${escapeHtml(it.sender || "")}</div>
              <div class="notif-text">${escapeHtml(it.text || "")}</div>
            </div>
            <span class="notif-when">${escapeHtml(it.when || "now")}</span>
          </div>`).join("");
        return `
          <div class="prop-lockscreen">
            <div class="prop-lockscreen-time">${escapeHtml(d.header || "LOCKSCREEN · SILENT MODE")}</div>
            <div class="notif-stack">${itemsHtml}</div>
          </div>`;
      }
    }
    return "";
  }

  function sceneBlocks(scene, s) {
    const raw = typeof scene.body === "function" ? scene.body(s) : scene.body;
    return (raw || []).filter(Boolean);
  }

  function applySceneChrome(scene, overrideLocation) {
    topbar.classList.remove("hidden");
    const mood = scene.mood || "august";
    document.documentElement.setAttribute("data-mood", mood);
    ambientAudio.setMood(mood);
    const roman = ROMAN[scene.chapter] || scene.chapter;
    topChapter.textContent = `CHAPTER ${roman} · ${String(scene.chapterTitle || "").toUpperCase()}`;
    topLocation.textContent = overrideLocation || scene.location || "CHANDIGARH";
    progressFill.style.width = `${Math.min(100, Math.max(2, scene.progress || 0))}%`;
    return roman;
  }

  function undoRowHtml() {
    return `
      <div class="below-choices">
        <button id="btn-undo" class="text-link-btn" ${runtime.history.length ? "" : "disabled"}>← Step back</button>
        <span style="font-size:0.74rem;color:var(--text-muted);font-family:var(--font-mono)">${runtime.state.traces.length} traces left behind</span>
      </div>`;
  }

  function renderTitle() {
    runtime.view = "title";

    const unlockedCount = (meta.unlockedEndings || []).length;

        </div>

    const contBtn = document.getElementById("btn-continue");
    if (contBtn) {
      contBtn.onclick = () => {
        runtime.sceneId = saved.sceneId;

        runtime.reaction = saved.reaction && STORY[saved.reaction.nextId] ? saved.reaction : null;

        else renderScene();

    document.getElementById("btn-new").onclick = startFresh;

  function startFresh() {
    runtime.sceneId = "c1_assembly";

          <div class="recap-box">
            <div class="recap-title">Chain of Evils (${runtime.state.dominoes.length} Turning Points)</div>
            <ul class="domino-list">${dominoHtml}</ul>
          </div>
          <div class="recap-box">
            <div class="recap-title">Evidence &amp; Traces Left Behind (${runtime.state.traces.length})</div>
            <ul class="notes-list">${tracesHtml}</ul>
          </div>
          <div class="ending-actions">
            <button id="btn-end-replay" class="primary-btn">Start Again in August</button>
            <button id="btn-end-gallery" class="secondary-btn">Timelines (${meta.unlockedEndings.length}/7)</button>
            <button id="btn-end-copy" class="secondary-btn">Copy Outcome</button>
          </div>
        </div>`;
    }

    const choicesHtml = visibleChoices.length
      ? `<div class="choices-wrap">
          ${visibleChoices.map((c, idx) => `
            <button class="choice-btn" data-idx="${idx}">
              <span class="choice-num">${idx + 1}</span>
              <span class="choice-title">${formatRich(c.text)}</span>
            </button>`).join("")}
        </div>`
      : "";

    const bannerHtml = showBanner
      ? `<div class="chapter-banner">
           <div class="chapter-banner-num">Chapter ${roman}</div>
           <h2 class="chapter-banner-title">${escapeHtml(scene.chapterTitle)}</h2>
           ${scene.chapterSub ? `<div class="chapter-banner-sub">${escapeHtml(scene.chapterSub)}</div>` : ""}
         </div>`
      : "";

    appEl.innerHTML = `
      ${bannerHtml}
      <article class="story-stage">
        <div class="story-card">
          <div class="scene-tag">${escapeHtml(scene.location || "CHANDIGARH")}</div>
          ${blocks.map(renderBlock).join("")}
        </div>
        ${choicesHtml}
        ${endingHtml}
        ${undoRowHtml()}
      </article>
    `;

    document.querySelectorAll(".choice-btn").forEach(btn => {
      btn.onclick = () => pickChoice(Number(btn.dataset.idx));
    });
    const undoBtn = document.getElementById("btn-undo");
    if (undoBtn) undoBtn.onclick = stepBack;

    if (scene.ending) {
      document.getElementById("btn-end-replay").onclick = startFresh;
      document.getElementById("btn-end-gallery").onclick = openJournal;
      document.getElementById("btn-end-copy").onclick = () => {
        const txt = `No One Saw Us Leave — Ending ${scene.ending.num}: "${scene.ending.title}"`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => showToast("Outcome copied.")).catch(() => showToast(txt));
        } else {
          showToast(txt);
        }
      };
    }

    writeSave();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderReaction() {
    const r = runtime.reaction;
    if (!r) { renderScene(); return; }
    const scene = STORY[r.fromScene] || STORY[runtime.sceneId] || {};
    runtime.view = "reaction";
    runtime.currentChoices = [];
    applySceneChrome(scene, r.location);

    appEl.innerHTML = `
      <article class="story-stage reaction-stage">
        <div class="story-card">
          <div class="scene-tag">${escapeHtml(r.location || scene.location || "CHANDIGARH")}</div>
          <div class="picked-choice"><span class="picked-label">You</span>${formatRich(r.choiceText)}</div>
          ${(r.blocks || []).map(renderBlock).join("")}
        </div>
        <div class="choices-wrap">
          <button id="btn-continue-story" class="choice-btn continue-btn">
            <span class="choice-title">Continue</span>
            <span class="choice-num" aria-hidden="true">→</span>
          </button>
        </div>
        ${undoRowHtml()}
      </article>
    `;

    document.getElementById("btn-continue-story").onclick = continueStory;
    const undoBtn = document.getElementById("btn-undo");
    if (undoBtn) undoBtn.onclick = stepBack;
    writeSave();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function continueStory() {
    const r = runtime.reaction;
    if (!r) return;
    runtime.state.wordsRead += countWordsInBlocks(r.blocks);
    runtime.sceneId = r.nextId;
    runtime.reaction = null;
    renderScene();
  }

  function pickChoice(idx) {
    const choice = runtime.currentChoices[idx];
    if (!choice) return;

    const currentScene = STORY[runtime.sceneId];
    const blocks = sceneBlocks(currentScene, runtime.state);

    runtime.history.push({
      sceneId: runtime.sceneId,
      state: cloneState(runtime.state),
      lastChapterBanner: runtime.lastChapterBanner
    });

    if (choice.effect) choice.effect(runtime.state);
    runtime.state.wordsRead += countWordsInBlocks(blocks);

    const nextId = typeof choice.next === "function" ? choice.next(runtime.state) : choice.next;

    if (choice.reaction) {
      const rb = (typeof choice.reaction === "function" ? choice.reaction(runtime.state) : choice.reaction) || [];
      const filtered = rb.filter(Boolean);
      if (filtered.length) {
        runtime.reaction = {
          fromScene: runtime.sceneId,
          choiceText: choice.text,
          blocks: filtered,
          nextId,
          location: choice.reactionLocation || null
        };
        renderReaction();
        return;
      }
    }

    runtime.sceneId = nextId;
    renderScene();
  }

  function stepBack() {
    if (!runtime.history.length) return;
    const prev = runtime.history.pop();
    runtime.sceneId = prev.sceneId;
    runtime.state = prev.state;
    runtime.lastChapterBanner = prev.lastChapterBanner;
    runtime.reaction = null;
    renderScene();
  }

  /* ---------------- Traces Modal & Checkpoints ---------------- */
  function checkpointState(target) {
    const s = freshState();
    Object.assign(s, {
      harshTrust: 12, harshSuspicion: 0, meherAttachment: 6, meherDesperation: 2,
      guilt: 5, coverDepth: 6
    });
    Object.assign(s.flags, {
      c1_file: "forged_clean",
      c1_fee_debt: "promised_repay",
      c1_rohan_fight: "sided_meher",
      c1_alibi: "blank_cheque",
      c1_key_taken: "cautious",
      c1_towel_moment: "lingered",
      c1_first_lie: "smooth",
      c2_bunk_choice: "proxy_punch",
      c2_wrist: "touched",
      c2_crossing_mode: "calculated_cover",
      c2_neck_mark: true,
      c2_tapri_lie: "smooth_gaslight"
    });
    if (target === "c4_bathroom_floor" || target === "c5_farewell_sector26") {
      Object.assign(s.flags, {
        c3_watchman: "bribed_guard",
        c3_pepsi_rumour: "frame_rohan",
        c3_chemist: "used_harsh_cash"
      });
    }
    if (target === "c5_farewell_sector26") {
      Object.assign(s.flags, {
        c4_kit_disposal: "cleaned_all",
        c4_betadine_lie: "comforted_with_lie",
        c4_stop_confession: "december_promise",
        c4_simran_deal: "painted_meher_crazy"
      });
    }
    addTrace(s, "Resumed from a mid-year checkpoint.");
    return s;
  }

  function openJournal() {
    const unlocked = meta.unlockedEndings || [];
    const traces = runtime.state.traces || [];

    const endingsHtml = ENDINGS_CATALOG.map(e => {
      const isUnlocked = unlocked.includes(e.id);
      return `
        <div class="ending-item ${isUnlocked ? "unlocked" : ""}">
          <div class="ending-item-head">${isUnlocked ? `✓ Ending ${e.num}: ${escapeHtml(e.title)}` : `Ending ${e.num}: Undiscovered`}</div>
          <div class="ending-item-desc">${isUnlocked ? escapeHtml(e.desc) : "Make different choices when the walls close in to uncover this outcome."}</div>
        </div>`;
    }).join("");

    const tracesHtml = traces.length
      ? `<ul class="notes-list">${traces.map(n => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`
      : `<p style="font-size:0.85rem;color:var(--text-muted);margin:0;">No traces recorded yet in this run.</p>`;

    const jumpHtml = unlocked.length ? `
      <div class="modal-section-label">Checkpoints (Unlocked After First Completion)</div>
      <p style="font-size:0.79rem;color:var(--text-muted);margin:0 0 8px;">Jump to a turning point:</p>
      <div class="replay-row">
        <button class="pill-btn" data-jump="c3_october_routine">Ch III · October</button>
        <button class="pill-btn" data-jump="c4_bathroom_floor">Ch IV · November</button>
        <button class="pill-btn" data-jump="c5_farewell_sector26">Ch V · December 20</button>
      </div>` : "";

    modalBody.innerHTML = `
      <div class="modal-section-label">Traces &amp; Evidence Trail (This Run)</div>
      ${tracesHtml}
      <div class="modal-section-label">Endings Discovered (${unlocked.length}/7)</div>
      <div class="ending-grid">${endingsHtml}</div>
      ${jumpHtml}
      <div class="modal-section-label">Controls</div>
      <div class="replay-row">
        <button id="btn-modal-restart" class="pill-btn">Restart From August</button>
        <button id="btn-modal-clear" class="pill-btn">Clear Saved Slot</button>
      </div>
    `;

    modalBody.querySelectorAll("[data-jump]").forEach(btn => {
      btn.onclick = () => {
        const target = btn.getAttribute("data-jump");
        runtime.state = checkpointState(target);
        runtime.history = [];
        runtime.lastChapterBanner = 0;
        runtime.reaction = null;
        runtime.sceneId = target;
        closeJournal();
        renderScene();
      };
    });

    document.getElementById("btn-modal-restart").onclick = () => {
      closeJournal();
      startFresh();
    };
    document.getElementById("btn-modal-clear").onclick = () => {
      clearSave();
      showToast("Saved slot cleared.");
    };

    modalBackdrop.classList.add("open");
  }

  function closeJournal() { modalBackdrop.classList.remove("open"); }

  function toggleTheme() {
    meta.theme = meta.theme === "night" ? "paper" : "night";
    document.documentElement.setAttribute("data-theme", meta.theme);
    saveMeta(meta);
    showToast(meta.theme === "paper" ? "Ruled Register" : "Sodium Fog");
  }

  function cycleSize() {
    const order = ["s", "m", "l"];
    const next = order[(order.indexOf(meta.size || "m") + 1) % order.length];
    meta.size = next;
    document.documentElement.setAttribute("data-size", next);
    saveMeta(meta);
    showToast(`Text size: ${next.toUpperCase()}`);
  }

  function toggleAudio() {
    const on = ambientAudio.toggle();
    const btn = document.getElementById("btn-audio");
    const iconOff = document.getElementById("audio-icon-off");
    const iconOn = document.getElementById("audio-icon-on");
    if (btn) btn.classList.toggle("active", on);
    if (iconOff) iconOff.style.display = on ? "none" : "block";
    if (iconOn) iconOn.style.display = on ? "block" : "none";
  }

  document.getElementById("btn-journal").onclick = openJournal;
  document.getElementById("btn-close-modal").onclick = closeJournal;
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) closeJournal();
  });
  document.getElementById("btn-audio").onclick = toggleAudio;
  document.getElementById("btn-size").onclick = cycleSize;
  document.getElementById("btn-theme").onclick = toggleTheme;
  document.getElementById("btn-home").onclick = renderTitle;

  document.addEventListener("keydown", (e) => {
    if (modalBackdrop.classList.contains("open")) {
      if (e.key === "Escape") closeJournal();
      return;
    }
    if (runtime.view === "reaction") {
      if (e.key === "Enter" || e.key === " " || e.key === "1") {
        e.preventDefault();
        continueStory();
      } else if (e.key === "Backspace") {
        stepBack();
      }
      return;
    }
    if (runtime.view === "game") {
      const n = Number(e.key);
      if (n >= 1 && n <= runtime.currentChoices.length) {
        pickChoice(n - 1);
      } else if (e.key === "Backspace" && runtime.history.length) {
        stepBack();
      }
    }
  });

  renderTitle();
})();
</script>
</body>
</html>
