<!DOCTYPE html>
<html lang="en" data-theme="night" data-weather="storm" data-size="m">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>After the Last Local — A Mumbai Monsoon Story</title>
<link rel="icon" type="image/png" href="../../assets/images/PK-Logo-Light.png" />
<link rel="apple-touch-icon" href="../../assets/images/PK-Logo-Light.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --prose-size: 1.14rem;
    --prose-lh: 1.82;
    --max-width: 680px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  [data-size="s"] { --prose-size: 1.02rem; --prose-lh: 1.75; }
  [data-size="m"] { --prose-size: 1.14rem; --prose-lh: 1.82; }
  [data-size="l"] { --prose-size: 1.28rem; --prose-lh: 1.86; }

  /* Theme: Monsoon Night */
  [data-theme="night"] {
    --bg-base: #0b1017;
    --bg-grad-1: #111a28;
    --bg-grad-2: #0a0e14;
    --surface: rgba(18, 25, 36, 0.86);
    --surface-solid: #141c28;
    --surface-elevated: rgba(27, 36, 51, 0.92);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(229, 169, 84, 0.35);
    --text-main: #ede6da;
    --text-soft: #b6b0a6;
    --text-muted: #7f8ca0;
    --accent: #e5a954;
    --accent-soft: rgba(229, 169, 84, 0.13);
    --accent-glow: rgba(229, 169, 84, 0.22);
    --rose: #d97a6c;
    --rose-soft: rgba(217, 122, 108, 0.14);
    --chat-bg: #0f1621;
    --chat-me: #1f3c36;
    --chat-them: #1b2432;
    --ticket-bg: #e9dec6;
    --ticket-ink: #221d17;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  /* Theme: Warm Paper */
  [data-theme="paper"] {
    --bg-base: #f4eee2;
    --bg-grad-1: #efe6d5;
    --bg-grad-2: #f8f4ec;
    --surface: rgba(252, 249, 243, 0.92);
    --surface-solid: #fbf7ef;
    --surface-elevated: #ffffff;
    --border: rgba(45, 34, 24, 0.1);
    --border-strong: rgba(178, 102, 36, 0.42);
    --text-main: #241e18;
    --text-soft: #4c4238;
    --text-muted: #84786b;
    --accent: #b8651b;
    --accent-soft: rgba(184, 101, 27, 0.1);
    --accent-glow: rgba(184, 101, 27, 0.16);
    --rose: #b84b42;
    --rose-soft: rgba(184, 75, 66, 0.1);
    --chat-bg: #ebe4d6;
    --chat-me: #d4ebd7;
    --chat-them: #ffffff;
    --ticket-bg: #f1e3c4;
    --ticket-ink: #221d17;
    --shadow: 0 18px 45px rgba(48, 34, 20, 0.09);
  }

  /* Weather-responsive subtle backdrop shifts */
  [data-theme="night"][data-weather="golden"] {
    --bg-grad-1: #23191d;
    --bg-grad-2: #0d1118;
  }
  [data-theme="night"][data-weather="dawn"] {
    --bg-grad-1: #1d1a2c;
    --bg-grad-2: #0f1622;
  }
  [data-theme="night"][data-weather="indoor"] {
    --bg-grad-1: #1b1714;
    --bg-grad-2: #0c0e13;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg-base);
    color: var(--text-main);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--font-sans);
    background:
      radial-gradient(ellipse 85% 60% at 50% 0%, var(--bg-grad-1), transparent 70%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-grad-2) 100%);
    color: var(--text-main);
    overflow-x: hidden;
    transition: background 0.9s ease, color 0.35s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }

  #rain-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
    transition: opacity 0.8s ease;
  }
  [data-theme="paper"] #rain-canvas { opacity: 0.22; }
  body.reduced-motion #rain-canvas { display: none; }

  /* Top Navigation Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg-base) 80%, transparent);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .topbar.hidden {
    display: none;
  }
  .topbar-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .scene-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .scene-chapter {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scene-location {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    border-radius: 10px;
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-sans);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover {
    border-color: var(--border-strong);
    color: var(--text-main);
    background: var(--surface-elevated);
  }
  .icon-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .icon-btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .btn-label { display: inline; }
  @media (max-width: 600px) {
    .btn-label { display: none; }
    .icon-btn { padding: 0 8px; }
  }

  .progress-track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: transparent;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--rose), var(--accent));
    transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Layout Shell */
  .app-shell {
    position: relative;
    z-index: 2;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  /* Title Screen */
  .title-screen {
    min-height: calc(100dvh - 48px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px 12px;
    animation: fadeUp 0.8s ease both;
  }
  .title-kicker {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--accent-soft);
  }
  .title-main {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(2.4rem, 7vw, 4.1rem);
    line-height: 1.06;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    color: var(--text-main);
  }
  .title-main em {
    font-style: italic;
    color: var(--accent);
  }
  .title-sub {
    font-family: var(--font-serif);
    font-size: clamp(1.06rem, 2.6vw, 1.24rem);
    line-height: 1.65;
    color: var(--text-soft);
    max-width: 520px;
    margin: 0 0 32px;
  }
  .title-cta-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 340px;
  }
  .primary-btn {
    width: 100%;
    appearance: none;
    border: none;
    border-radius: var(--radius-md);
    padding: 15px 24px;
    font-family: var(--font-sans);
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #d68d3a);
    color: #16110b;
    box-shadow: 0 10px 28px var(--accent-glow);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .primary-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.06);
  }
  .primary-btn:active { transform: translateY(0); }

  .secondary-btn {
    width: 100%;
    appearance: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 20px;
    font-family: var(--font-sans);
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-main);
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .secondary-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-elevated);
  }

  .title-meta-row {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 18px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .title-meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .title-controls {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Chapter Banner */
  .chapter-banner {
    margin: 10px 0 28px;
    padding: 20px 22px;
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }
  .chapter-banner-num {
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .chapter-banner-title {
    font-family: var(--font-serif);
    font-size: clamp(1.45rem, 4vw, 1.95rem);
    font-weight: 500;
    margin: 0;
    line-height: 1.25;
  }

  /* Story Prose Card */
  .story-stage {
    animation: fadeUp 0.4s ease both;
  }
  .story-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: clamp(22px, 4.5vw, 38px) clamp(20px, 5vw, 40px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .scene-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .scene-tag::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .prose-block {
    font-family: var(--font-serif);
    font-size: var(--prose-size);
    line-height: var(--prose-lh);
    color: var(--text-main);
    margin: 0 0 1.25em;
    letter-spacing: 0.004em;
  }
  .prose-block:last-child { margin-bottom: 0; }
  .prose-block em { color: color-mix(in srgb, var(--text-main) 90%, var(--accent)); }
  .prose-block strong { font-weight: 600; color: var(--text-main); }

  .prose-quote {
    margin: 1.3em 0;
    padding: 4px 0 4px 18px;
    border-left: 2px solid var(--accent);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: calc(var(--prose-size) * 1.02);
    line-height: var(--prose-lh);
    color: var(--text-soft);
  }

  .scene-divider {
    text-align: center;
    margin: 24px 0;
    color: var(--accent);
    letter-spacing: 0.45em;
    font-size: 0.9rem;
    opacity: 0.75;
    user-select: none;
  }

  /* WhatsApp / Phone Chat Widget */
  .chat-card {
    margin: 22px 0;
    border-radius: var(--radius-md);
    background: var(--chat-bg);
    border: 1px solid var(--border);
    overflow: hidden;
    font-family: var(--font-sans);
  }
  .chat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
  }
  .chat-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rose), var(--accent));
    color: #16110b;
    font-weight: 700;
    font-size: 0.82rem;
    display: grid;
    place-items: center;
  }
  .chat-name { font-size: 0.86rem; font-weight: 600; color: var(--text-main); }
  .chat-status { font-size: 0.72rem; color: var(--text-muted); }
  .chat-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .bubble {
    max-width: 84%;
    padding: 9px 13px;
    border-radius: 13px;
    font-size: 0.9rem;
    line-height: 1.48;
    color: var(--text-main);
    position: relative;
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--chat-them);
    border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--chat-me);
    border-bottom-right-radius: 4px;
  }
  .bubble-time {
    display: block;
    margin-top: 4px;
    font-size: 0.67rem;
    opacity: 0.62;
    text-align: right;
    font-family: var(--font-mono);
  }

  /* Physical Prop Cards (Train Ticket, Email, Handwritten Note) */
  .prop-ticket {
    margin: 24px auto;
    max-width: 440px;
    background: var(--ticket-bg);
    color: var(--ticket-ink);
    border-radius: 6px;
    padding: 16px 20px;
    font-family: var(--font-mono);
    border: 1px dashed rgba(34, 29, 23, 0.35);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
    transform: rotate(-0.8deg);
    position: relative;
  }
  .prop-ticket-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    border-bottom: 1px solid rgba(34, 29, 23, 0.2);
    padding-bottom: 6px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .prop-ticket-route {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .prop-ticket-sub {
    font-size: 0.74rem;
    opacity: 0.78;
    margin-bottom: 12px;
  }
  .prop-ticket-sharpie {
    border-top: 1px dotted rgba(34, 29, 23, 0.3);
    padding-top: 10px;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.12rem;
    color: #192b5a;
  }

  .prop-email {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-elevated);
    padding: 16px 18px;
    font-family: var(--font-sans);
  }
  .prop-email-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .prop-email-subject {
    font-weight: 700;
    font-size: 0.98rem;
    margin-bottom: 4px;
    color: var(--text-main);
  }
  .prop-email-from {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .prop-email-body {
    font-size: 0.9rem;
    line-height: 1.62;
    color: var(--text-soft);
  }

  .prop-draft {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid rgba(217, 122, 108, 0.35);
    background: var(--rose-soft);
    padding: 14px 16px;
    font-family: var(--font-sans);
  }
  .prop-draft-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rose);
    margin-bottom: 6px;
  }
  .prop-draft-text {
    font-size: 0.94rem;
    line-height: 1.55;
    color: var(--text-main);
  }

  /* Choices Section */
  .choices-wrap {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    animation: fadeUp 0.45s 0.08s ease both;
  }
  .choice-btn {
    width: 100%;
    text-align: left;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 18px;
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(10px);
  }
  .choice-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-elevated);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .choice-btn:active { transform: scale(0.992); }
  .choice-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    margin-top: 2px;
    border-radius: 7px;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.74rem;
    font-weight: 600;
    display: grid;
    place-items: center;
  }
  .choice-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .choice-title {
    font-family: var(--font-sans);
    font-size: 0.98rem;
    font-weight: 500;
    line-height: 1.48;
    color: var(--text-main);
  }
  .choice-sub {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .below-choices {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .text-link-btn {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    cursor: pointer;
    padding: 6px 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s ease;
  }
  .text-link-btn:hover { color: var(--accent); }
  .text-link-btn:disabled { opacity: 0.35; pointer-events: none; }

  /* Ending Panel */
  .ending-card {
    margin-top: 24px;
    padding: 28px 24px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, var(--accent-soft), var(--surface));
    border: 1px solid var(--border-strong);
    text-align: center;
    animation: fadeUp 0.6s ease both;
  }
  .ending-badge {
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .ending-title {
    font-family: var(--font-serif);
    font-size: clamp(1.6rem, 4.5vw, 2.2rem);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .ending-subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--text-soft);
    margin: 0 0 22px;
    font-size: 1.05rem;
  }
  .memory-recap {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin: 0 0 22px;
  }
  .memory-recap-title {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .memory-list {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text-soft);
  }
  .ending-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ending-actions button { width: auto; min-width: 170px; }

  /* Drawer / Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 13, 0.68);
    backdrop-filter: blur(6px);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-panel {
    width: 100%;
    max-width: 560px;
    max-height: 86dvh;
    overflow-y: auto;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 22px 26px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.25s ease both;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title {
    font-family: var(--font-serif);
    font-size: 1.38rem;
    font-weight: 500;
    margin: 0;
  }
  .modal-section-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 18px 0 10px;
  }
  .ending-grid {
    display: grid;
    gap: 9px;
  }
  .ending-item {
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .ending-item.unlocked {
    border-color: var(--border-strong);
    background: var(--accent-soft);
  }
  .ending-item-head {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 3px;
  }
  .ending-item-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .replay-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .pill-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-main);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .pill-btn:hover {
    border-color: var(--border-strong);
    color: var(--accent);
  }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    z-index: 80;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .app-shell { padding: 14px 12px 72px; }
    .story-card { padding: 20px 17px; }
    .choice-btn { padding: 13px 14px; gap: 11px; }
    .choice-title { font-size: 0.94rem; }
  }
</style>

<body>
<canvas id="rain-canvas" aria-hidden="true"></canvas>

<header id="topbar" class="topbar hidden">
  <div class="topbar-inner">
    <div class="scene-meta">
      <div id="top-chapter" class="scene-chapter">CHAPTER I</div>
      <div id="top-location" class="scene-location">DADAR STATION · 23:48</div>
    </div>
    <div class="topbar-actions">
      <button id="btn-journal" class="icon-btn" title="Memory Journal & Endings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span class="btn-label">Journal</span>
      </button>
      <button id="btn-audio" class="icon-btn" title="Toggle Rain Ambience">
        <svg id="audio-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <svg id="audio-icon-on" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span class="btn-label">Rain</span>
      </button>
      <button id="btn-size" class="icon-btn" title="Text Size (S/M/L)">
        <span style="font-family:var(--font-serif);font-weight:600">Aa</span>
      </button>
      <button id="btn-theme" class="icon-btn" title="Switch Theme (Night / Paper)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
      <button id="btn-home" class="icon-btn" title="Title Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </div>
  </div>
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
</header>

<main id="app" class="app-shell"></main>

<!-- Journal & Endings Modal -->
<div id="journal-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">The Dadar Ticket &amp; Memories</h2>
      <button id="btn-close-modal" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {
  "use strict";

  const SAVE_KEY = "after_last_local_save_v1";
  const META_KEY = "after_last_local_meta_v1";

  const ENDINGS_CATALOG = [
    { id: "ending_1", num: "I", title: "Two Return Tickets, One Suitcase", desc: "Leaving safety behind and stepping onto the escalator together.", hint: "Requires bold personal courage, deep honesty, and refusing to settle for a half-life." },
    { id: "ending_2", num: "II", title: "The Monsoon We Kept", desc: "Choosing to stay, build, and root a messy real life in Mumbai.", hint: "Earned through steady trust, warmth, and helping each other face what you were running from." },
    { id: "ending_3", num: "III", title: "What We Almost Said at Marine Drive", desc: "An unforgettable dawn walk where pride kept three words unspoken.", hint: "High affection and spark, tempered by holding back when the door opened." },
    { id: "ending_4", num: "IV", title: "Before the Concrete Dries", desc: "Loving someone honestly enough to let their wings open without bitterness.", hint: "High honesty and respect when your timelines genuinely point in different directions." },
    { id: "ending_5", num: "V", title: "The Text That Stayed in Drafts", desc: "Choosing armour over risk—and finally waking up in the rain alone.", hint: "When guardedness, safe obligations, or pride keep you behind glass." }
  ];

  function freshState() {
    return {
      stats: {
        honesty: 0,
        openness: 0,
        spark: 0,
        warmth: 0,
        trust: 0,
        courage: 0,
        guard: 0,
        duty: 0,
        friction: 0
      },
      flags: {},
      memories: [],
      readingWords: 0
    };
  }

  function addMemory(s, text) {
    if (!s.memories.includes(text)) s.memories.push(text);
  }

  function cloneState(s) {
    return JSON.parse(JSON.stringify(s));
  }

  function loadMeta() {
    try {
      const raw = localStorage.getItem(META_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { unlockedEndings: [], theme: "night", size: "m", reducedMotion: false };
  }

  function saveMeta(meta) {
    try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (_) {}
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return null;
  }

  function writeSave() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        sceneId: runtime.sceneId,
        state: runtime.state,
        history: runtime.history.slice(-30),
        lastChapterBanner: runtime.lastChapterBanner
      }));
    } catch (_) {}
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
  }

  const meta = loadMeta();
  document.documentElement.setAttribute("data-theme", meta.theme || "night");
  document.documentElement.setAttribute("data-size", meta.size || "m");
  if (meta.reducedMotion) document.body.classList.add("reduced-motion");

  const runtime = {
    view: "title",
    sceneId: "c1_intro",
    state: freshState(),
    history: [],
    lastChapterBanner: 0,
    currentChoices: []
  };

  /* ---------------- Web Audio Procedural Rain ---------------- */
  const rainAudio = {
    ctx: null,
    master: null,
    filter: null,
    playing: false,
    toggle() {
      if (this.playing) {
        this.stop();
        return false;
      } else {
        this.start();
        return true;
      }
    },
    start() {
      try {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          const bufferSize = this.ctx.sampleRate * 3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.997 * b0 + white * 0.029;
            b1 = 0.985 * b1 + white * 0.032;
            b2 = 0.950 * b2 + white * 0.048;
            data[i] = (b0 + b1 + b2 + white * 0.08) * 0.45;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;

          this.filter = this.ctx.createBiquadFilter();
          this.filter.type = "lowpass";
          this.filter.frequency.value = 1150;

          this.master = this.ctx.createGain();
          this.master.gain.value = 0.0001;

          src.connect(this.filter);
          this.filter.connect(this.master);
          this.master.connect(this.ctx.destination);
          src.start();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(0.22, this.ctx.currentTime + 0.9);
        this.playing = true;
        this.setWeather(document.documentElement.getAttribute("data-weather") || "storm");
      } catch (_) {
        showToast("Audio unavailable in this browser.");
      }
    },
    stop() {
      if (this.ctx && this.master) {
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.45);
      }
      this.playing = false;
    },
    setWeather(w) {
      if (!this.ctx || !this.filter || !this.playing) return;
      const freqMap = { storm: 1450, drizzle: 900, mist: 650, indoor: 520, golden: 420, dawn: 480 };
      const gainMap = { storm: 0.26, drizzle: 0.16, mist: 0.12, indoor: 0.15, golden: 0.07, dawn: 0.08 };
      const t = this.ctx.currentTime;
      this.filter.frequency.linearRampToValueAtTime(freqMap[w] || 1000, t + 1.2);
      this.master.gain.linearRampToValueAtTime(gainMap[w] || 0.16, t + 1.2);
    }
  };

  /* ---------------- Ambient Rain Canvas ---------------- */
  (() => {
    const canvas = document.getElementById("rain-canvas");
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1;
    const drops = [];
    const COUNT = 85;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < COUNT; i++) {
      drops.push({
        x: Math.random() * w,
        y: Math.random() * h,
        len: 10 + Math.random() * 22,
        speed: 6 + Math.random() * 9,
        alpha: 0.08 + Math.random() * 0.22
      });
    }

    function tick() {
      if (!document.body.classList.contains("reduced-motion")) {
        ctx.clearRect(0, 0, w, h);
        const weather = document.documentElement.getAttribute("data-weather") || "storm";
        const isPaper = document.documentElement.getAttribute("data-theme") === "paper";
        const mult = weather === "storm" ? 1 : weather === "drizzle" ? 0.55 : weather === "indoor" ? 0.35 : 0.18;
        const activeCount = Math.floor(COUNT * mult);
        ctx.lineWidth = 1;
        for (let i = 0; i < activeCount; i++) {
          const d = drops[i];
          ctx.strokeStyle = isPaper
            ? `rgba(110, 92, 74, ${d.alpha * 0.65})`
            : `rgba(195, 215, 240, ${d.alpha})`;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 1.8, d.y + d.len);
          ctx.stroke();
          d.x -= 1.1;
          d.y += d.speed * (weather === "storm" ? 1.15 : 0.8);
          if (d.y > h + 20) {
            d.y = -30;
            d.x = Math.random() * (w + 80);
          }
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ---------------- UI Helpers ---------------- */
  const appEl = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const topChapter = document.getElementById("top-chapter");
  const topLocation = document.getElementById("top-location");
  const progressFill = document.getElementById("progress-fill");
  const modalBackdrop = document.getElementById("journal-modal");
  const modalBody = document.getElementById("modal-body");

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatRich(str) {
    // Allow intentional inline tags like <em>, <strong>, <br> from story data safely
    return String(str);
  }

  function countWordsInBlocks(blocks) {
    let words = 0;
    for (const b of blocks) {
      if (b.text) words += b.text.replace(/<[^>]+>/g, "").trim().split(/\s+/).length;
      if (b.messages) {
        for (const m of b.messages) words += m.text.trim().split(/\s+/).length;
      }
      if (b.data && b.data.body) words += b.data.body.replace(/<[^>]+>/g, "").trim().split(/\s+/).length;
    }
    return words;
  }

  function renderBlock(b) {
    if (b.type === "p") {
      return `<p class="prose-block">${formatRich(b.text)}</p>`;
    }
    if (b.type === "quote") {
      return `<blockquote class="prose-quote">${formatRich(b.text)}</blockquote>`;
    }
    if (b.type === "divider") {
      return `<div class="scene-divider" aria-hidden="true">· · ·</div>`;
    }
    if (b.type === "chat") {
      const msgs = b.messages.map(m => `
        <div class="bubble ${m.from === "me" ? "me" : "them"}">
          ${escapeHtml(m.text)}
          ${m.time ? `<span class="bubble-time">${escapeHtml(m.time)}${m.from === "me" ? " ✓✓" : ""}</span>` : ""}
        </div>`).join("");
      return `
        <div class="chat-card">
          <div class="chat-head">
            <div class="chat-avatar">${escapeHtml((b.header || "T")[0])}</div>
            <div>
              <div class="chat-name">${escapeHtml(b.header || "Tara")}</div>
              <div class="chat-status">${escapeHtml(b.status || "online")}</div>
            </div>
          </div>
          <div class="chat-body">${msgs}</div>
        </div>`;
    }
    if (b.type === "prop") {
      const d = b.data || {};
      if (b.kind === "ticket") {
        return `
          <div class="prop-ticket">
            <div class="prop-ticket-header">
              <span>WESTERN RAILWAY · II CL</span>
              <span>₹${escapeHtml(d.fare || "10")} · ${escapeHtml(d.date || "TUE JUL")}</span>
            </div>
            <div class="prop-ticket-route">${escapeHtml(d.route || "DADAR → BANDRA")}</div>
            <div class="prop-ticket-sub">${escapeHtml(d.meta || "VALID FOR ONE JOURNEY · NON-TRANSFERABLE")}</div>
            <div class="prop-ticket-sharpie">${formatRich(d.note || "")}</div>
          </div>`;
      }
      if (b.kind === "email") {
        return `
          <div class="prop-email">
            <div class="prop-email-label">${escapeHtml(d.label || "INBOX")}</div>
            <div class="prop-email-subject">${escapeHtml(d.subject || "")}</div>
            <div class="prop-email-from">${escapeHtml(d.from || "")}</div>
            <div class="prop-email-body">${formatRich(d.body || "")}</div>
          </div>`;
      }
      if (b.kind === "draft") {
        return `
          <div class="prop-draft">
            <div class="prop-draft-label">${escapeHtml(d.label || "UNSENT DRAFT")}</div>
            <div class="prop-draft-text">${formatRich(d.body || "")}</div>
          </div>`;
      }
    }
    return "";
  }

  /* ---------------- Render Views ---------------- */
  function renderTitle() {
    runtime.view = "title";
    topbar.classList.add("hidden");
    document.documentElement.setAttribute("data-weather", "storm");
    const saved = loadSave();
    const unlockedCount = (meta.unlockedEndings || []).length;

    appEl.innerHTML = `
      <section class="title-screen">
        <div class="title-kicker">Interactive Romance · Mumbai · ~30 Min</div>
        <h1 class="title-main">After the <em>Last Local</em></h1>
        <p class="title-sub">
          11:48 PM at Dadar Station. One cancelled train, a soggy box of medu vada,
          and seven days of monsoon that ask what you’re actually willing to risk at twenty-five.
        </p>
        <div class="title-cta-group">
          ${saved ? `<button id="btn-continue" class="primary-btn">Continue Journey</button>` : ""}
          <button id="btn-new" class="${saved ? "secondary-btn" : "primary-btn"}">${saved ? "Start a New Story" : "Begin Story"}</button>
          <button id="btn-title-journal" class="secondary-btn">Endings &amp; Memories (${unlockedCount}/5 Unlocked)</button>
        </div>
        <div class="title-meta-row">
          <span class="title-meta-pill">6 Chapters</span>
          <span>·</span>
          <span class="title-meta-pill">5 Distinct Endings</span>
          <span>·</span>
          <span class="title-meta-pill">Auto-Saved Locally</span>
        </div>
        <div class="title-controls">
          <a href="../episodes-list.html" class="pill-btn" style="text-decoration:none;display:inline-flex;align-items:center;">← All Episodes</a>
          <button id="btn-title-theme" class="pill-btn">Theme: ${meta.theme === "paper" ? "Warm Paper" : "Monsoon Night"}</button>
          <button id="btn-title-audio" class="pill-btn">Rain Audio: ${rainAudio.playing ? "On" : "Off"}</button>
          <button id="btn-title-motion" class="pill-btn">Rain Visuals: ${meta.reducedMotion ? "Off" : "On"}</button>
        </div>
      </section>
    `;

    const contBtn = document.getElementById("btn-continue");
    if (contBtn) {
      contBtn.onclick = () => {
        runtime.sceneId = saved.sceneId;
        runtime.state = saved.state;
        runtime.history = saved.history || [];
        runtime.lastChapterBanner = saved.lastChapterBanner || 0;
        renderScene();
      };
    }

    document.getElementById("btn-new").onclick = () => {
      runtime.sceneId = "c1_intro";
      runtime.state = freshState();
      runtime.history = [];
      runtime.lastChapterBanner = 0;
      writeSave();
      renderScene();
    };

    document.getElementById("btn-title-journal").onclick = openJournal;
    document.getElementById("btn-title-theme").onclick = () => { toggleTheme(); renderTitle(); };
    document.getElementById("btn-title-audio").onclick = () => { toggleAudio(); renderTitle(); };
    document.getElementById("btn-title-motion").onclick = () => {
      meta.reducedMotion = !meta.reducedMotion;
      document.body.classList.toggle("reduced-motion", meta.reducedMotion);
      saveMeta(meta);
      renderTitle();
    };
  }

  function renderScene() {
    const scene = STORY[runtime.sceneId];
    if (!scene) {
      showToast("Scene missing: " + runtime.sceneId);
      return;
    }

    runtime.view = "game";
    topbar.classList.remove("hidden");

    const weather = scene.weather || "storm";
    document.documentElement.setAttribute("data-weather", weather);
    rainAudio.setWeather(weather);

    const roman = ["", "I", "II", "III", "IV", "V", "VI"][scene.chapter] || scene.chapter;
    topChapter.textContent = `CHAPTER ${roman} · ${scene.chapterTitle.toUpperCase()}`;
    topLocation.textContent = scene.location || "MUMBAI";
    progressFill.style.width = `${Math.min(100, Math.max(3, scene.progress || 0))}%`;

    const showBanner = scene.chapter && scene.chapter !== runtime.lastChapterBanner;
    if (showBanner) runtime.lastChapterBanner = scene.chapter;

    const blocks = typeof scene.body === "function" ? scene.body(runtime.state) : scene.body;
    const rawChoices = typeof scene.choices === "function" ? scene.choices(runtime.state) : (scene.choices || []);

    const choicesHtml = visibleChoices.length
      ? `<div class="choices-wrap">
          ${visibleChoices.map((c, idx) => `

            </button>
          `).join("")}
        </div>`
      : "";

      ? `<div class="chapter-banner">
           <div class="chapter-banner-num">Chapter ${roman}</div>

  function pickChoice(idx) {
    const choice = runtime.currentChoices[idx];
    if (!choice) return;

    const currentScene = STORY[runtime.sceneId];
    const blocks = typeof currentScene.body === "function" ? currentScene.body(runtime.state) : currentScene.body;

    runtime.history.push({
      sceneId: runtime.sceneId,
      state: cloneState(runtime.state),
      lastChapterBanner: runtime.lastChapterBanner
    });

    if (choice.effect) choice.effect(runtime.state);
    runtime.state.readingWords += countWordsInBlocks(blocks);

    const nextId = typeof choice.next === "function" ? choice.next(runtime.state) : choice.next;
    runtime.sceneId = nextId;
    renderScene();
  }

  function stepBack() {
    if (!runtime.history.length) return;
    const prev = runtime.history.pop();
    runtime.sceneId = prev.sceneId;
    runtime.state = prev.state;
    runtime.lastChapterBanner = prev.lastChapterBanner;
    renderScene();
  }

        runtime.sceneId = target;
        closeJournal();
        renderScene();
      };
    });

    document.getElementById("btn-modal-restart").onclick = () => {
      runtime.sceneId = "c1_intro";
      runtime.state = freshState();
      runtime.history = [];
      runtime.lastChapterBanner = 0;
      closeJournal();

    };
    document.getElementById("btn-modal-clear").onclick = () => {
      clearSave();
      showToast("Saved slot cleared.");

  function cycleSize() {
    const order = ["s", "m", "l"];
    const next = order[(order.indexOf(meta.size || "m") + 1) % order.length];
    meta.size = next;
    document.documentElement.setAttribute("data-size", next);
    saveMeta(meta);
    showToast(`Text size: ${next.toUpperCase()}`);
  }
