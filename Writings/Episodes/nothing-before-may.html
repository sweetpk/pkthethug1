<!DOCTYPE html>
<html lang="en" data-theme="night" data-season="summer" data-size="m">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nothing Before May — A Delhi Prep-Year Story</title>
<link rel="icon" type="image/png" href="../../assets/images/PK-Logo-Light.png" />
<link rel="apple-touch-icon" href="../../assets/images/PK-Logo-Light.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --prose-size: 1.13rem;
    --prose-lh: 1.82;
    --max-width: 690px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  [data-size="s"] { --prose-size: 1.01rem; --prose-lh: 1.74; }
  [data-size="m"] { --prose-size: 1.13rem; --prose-lh: 1.82; }
  [data-size="l"] { --prose-size: 1.26rem; --prose-lh: 1.86; }

  /* Theme: Dusk Study (Old Rajinder Nagar / Patel Nagar study lamp) */
  [data-theme="night"] {
    --bg-base: #0c0f15;
    --bg-grad-1: #1a1922;
    --bg-grad-2: #090b10;
    --surface: rgba(19, 23, 32, 0.88);
    --surface-solid: #141924;
    --surface-elevated: rgba(28, 34, 46, 0.94);
    --border: rgba(255, 255, 255, 0.085);
    --border-strong: rgba(224, 169, 88, 0.38);
    --text-main: #ede7db;
    --text-soft: #b8b2a6;
    --text-muted: #7f8999;
    --accent: #e0a958;
    --accent-soft: rgba(224, 169, 88, 0.13);
    --accent-glow: rgba(224, 169, 88, 0.2);
    --rose: #d17a6b;
    --rose-soft: rgba(209, 122, 107, 0.13);
    --sage: #7ea892;
    --sage-soft: rgba(126, 168, 146, 0.12);
    --chat-bg: #10151e;
    --chat-me: #1d3933;
    --chat-them: #1b2230;
    --note-bg: #181c24;
    --shadow: 0 22px 54px rgba(0, 0, 0, 0.55);
  }

  /* Theme: Warm Paper (Printed mock booklet & ink) */
  [data-theme="paper"] {
    --bg-base: #f4eee1;
    --bg-grad-1: #ece1ce;
    --bg-grad-2: #f8f4eb;
    --surface: rgba(252, 249, 242, 0.94);
    --surface-solid: #fcf8ef;
    --surface-elevated: #ffffff;
    --border: rgba(38, 30, 22, 0.11);
    --border-strong: rgba(168, 93, 26, 0.42);
    --text-main: #221d17;
    --text-soft: #4c4237;
    --text-muted: #827669;
    --accent: #a85d1a;
    --accent-soft: rgba(168, 93, 26, 0.1);
    --accent-glow: rgba(168, 93, 26, 0.15);
    --rose: #b0463d;
    --rose-soft: rgba(176, 70, 61, 0.09);
    --sage: #3e6b54;
    --sage-soft: rgba(62, 107, 84, 0.1);
    --chat-bg: #eae3d4;
    --chat-me: #d4ebd7;
    --chat-them: #ffffff;
    --note-bg: #f9f3e6;
    --shadow: 0 18px 46px rgba(46, 33, 20, 0.09);
  }

  /* Delhi Season Backdrop Shifts */
  [data-theme="night"][data-season="summer"] {
    --bg-grad-1: #231c18;
    --bg-grad-2: #0d0e13;
  }
  [data-theme="night"][data-season="monsoon"] {
    --bg-grad-1: #121c29;
    --bg-grad-2: #090d14;
  }
  [data-theme="night"][data-season="autumn"] {
    --bg-grad-1: #24191b;
    --bg-grad-2: #0c0e14;
  }
  [data-theme="night"][data-season="winter"] {
    --bg-grad-1: #161b26;
    --bg-grad-2: #0a0c11;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg-base);
    color: var(--text-main);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    font-family: var(--font-sans);
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg-grad-1), transparent 72%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-grad-2) 100%);
    color: var(--text-main);
    overflow-x: hidden;
    transition: background 1s ease, color 0.35s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }

  #ambient-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.52;
    transition: opacity 0.8s ease;
  }
  [data-theme="paper"] #ambient-canvas { opacity: 0.24; }
  body.reduced-motion #ambient-canvas { display: none; }

  /* Top Sticky Header */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg-base) 82%, transparent);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  }
  .topbar.hidden { display: none; }
  .topbar-inner {
    max-width: 840px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .scene-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .scene-chapter {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scene-location {
    font-family: var(--font-mono);
    font-size: 0.69rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    border-radius: 10px;
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-sans);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover {
    border-color: var(--border-strong);
    color: var(--text-main);
    background: var(--surface-elevated);
  }
  .icon-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .icon-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .btn-label { display: inline; }
  @media (max-width: 620px) {
    .btn-label { display: none; }
    .icon-btn { padding: 0 8px; }
  }

  .progress-track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: transparent;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--rose), var(--accent));
    transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Layout Shell */
  .app-shell {
    position: relative;
    z-index: 2;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 24px 20px 88px;
  }

  /* Title Screen */
  .title-screen {
    min-height: calc(100dvh - 52px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 28px 12px;
    animation: fadeUp 0.75s ease both;
  }
  .title-kicker {
    font-family: var(--font-mono);
    font-size: 0.73rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--accent-soft);
  }
  .title-main {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(2.35rem, 6.8vw, 4rem);
    line-height: 1.07;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    color: var(--text-main);
  }
  .title-main em {
    font-style: italic;
    color: var(--accent);
  }
  .title-sub {
    font-family: var(--font-serif);
    font-size: clamp(1.04rem, 2.5vw, 1.22rem);
    line-height: 1.66;
    color: var(--text-soft);
    max-width: 540px;
    margin: 0 0 28px;
  }
  .title-note {
    font-size: 0.8rem;
    color: var(--text-muted);
    max-width: 460px;
    line-height: 1.55;
    margin: 0 0 28px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .title-cta-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    width: 100%;
    max-width: 340px;
  }
  .primary-btn {
    width: 100%;
    appearance: none;
    border: none;
    border-radius: var(--radius-md);
    padding: 15px 24px;
    font-family: var(--font-sans);
    font-size: 0.96rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #c98838);
    color: #16110b;
    box-shadow: 0 10px 28px var(--accent-glow);
    transition: transform 0.2s ease, filter 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .primary-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .primary-btn:active { transform: translateY(0); }

  .secondary-btn {
    width: 100%;
    appearance: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 20px;
    font-family: var(--font-sans);
    font-size: 0.91rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-main);
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .secondary-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-elevated);
  }

  .title-meta-row {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 16px;
    font-size: 0.79rem;
    color: var(--text-muted);
  }
  .title-controls {
    margin-top: 20px;
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Chapter Banner */
  .chapter-banner {
    margin: 8px 0 26px;
    padding: 20px 22px;
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-align: center;
    animation: fadeUp 0.45s ease both;
  }
  .chapter-banner-num {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .chapter-banner-title {
    font-family: var(--font-serif);
    font-size: clamp(1.45rem, 4vw, 1.95rem);
    font-weight: 500;
    margin: 0;
    line-height: 1.24;
  }

  /* Story Card */
  .story-stage { animation: fadeUp 0.38s ease both; }
  .story-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: clamp(22px, 4.5vw, 38px) clamp(20px, 5vw, 40px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .scene-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.71rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .scene-tag::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .prose-block {
    font-family: var(--font-serif);
    font-size: var(--prose-size);
    line-height: var(--prose-lh);
    color: var(--text-main);
    margin: 0 0 1.24em;
    letter-spacing: 0.003em;
  }
  .prose-block:last-child { margin-bottom: 0; }
  .prose-block em { color: color-mix(in srgb, var(--text-main) 88%, var(--accent)); }
  .prose-block strong { font-weight: 600; color: var(--text-main); }

  .prose-quote {
    margin: 1.35em 0;
    padding: 4px 0 4px 18px;
    border-left: 2px solid var(--accent);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: calc(var(--prose-size) * 1.01);
    line-height: var(--prose-lh);
    color: var(--text-soft);
  }

  .scene-divider {
    text-align: center;
    margin: 24px 0;
    color: var(--accent);
    letter-spacing: 0.45em;
    font-size: 0.88rem;
    opacity: 0.7;
    user-select: none;
  }

  /* WhatsApp Thread Widget */
  .chat-card {
    margin: 22px 0;
    border-radius: var(--radius-md);
    background: var(--chat-bg);
    border: 1px solid var(--border);
    overflow: hidden;
    font-family: var(--font-sans);
  }
  .chat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface-solid) 90%, transparent);
  }
  .chat-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rose), var(--accent));
    color: #16110b;
    font-weight: 700;
    font-size: 0.8rem;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .chat-name { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
  .chat-status { font-size: 0.71rem; color: var(--text-muted); }
  .chat-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chat-day-pill {
    align-self: center;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    margin: 4px 0;
  }
  .bubble {
    max-width: 84%;
    padding: 9px 13px;
    border-radius: 13px;
    font-size: 0.89rem;
    line-height: 1.48;
    color: var(--text-main);
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--chat-them);
    border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--chat-me);
    border-bottom-right-radius: 4px;
  }
  .bubble.deleted {
    font-style: italic;
    color: var(--text-muted);
  }
  .bubble-sender {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .bubble-time {
    display: block;
    margin-top: 4px;
    font-size: 0.66rem;
    opacity: 0.62;
    text-align: right;
    font-family: var(--font-mono);
  }

  /* Mock Scorecard Widget */
  .prop-mock {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--surface-elevated);
    padding: 16px 18px;
    font-family: var(--font-mono);
  }
  .prop-mock-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .prop-mock-title {
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .prop-mock-date {
    font-size: 0.68rem;
    color: var(--text-muted);
  }
  .prop-mock-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  @media (max-width: 500px) {
    .prop-mock-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .prop-mock-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
  }
  .prop-mock-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }
  .prop-mock-val {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-main);
  }
  .prop-mock-val.highlight { color: var(--accent); }
  .prop-mock-note {
    margin-top: 10px;
    font-family: var(--font-sans);
    font-size: 0.82rem;
    color: var(--text-soft);
    line-height: 1.5;
  }

  /* Notes App / Margin Note */
  .prop-note {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    background: var(--note-bg);
    padding: 14px 17px;
  }
  .prop-note-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.67rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .prop-note-body {
    font-family: var(--font-serif);
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--text-soft);
  }

  /* Email / Official Notice */
  .prop-email {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-elevated);
    padding: 16px 18px;
    font-family: var(--font-sans);
  }
  .prop-email-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .prop-email-subject {
    font-weight: 700;
    font-size: 0.96rem;
    margin-bottom: 4px;
    color: var(--text-main);
  }
  .prop-email-from {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .prop-email-body {
    font-size: 0.9rem;
    line-height: 1.62;
    color: var(--text-soft);
  }

  /* Unsent Draft */
  .prop-draft {
    margin: 22px 0;
    border-radius: var(--radius-md);
    border: 1px solid rgba(209, 122, 107, 0.34);
    background: var(--rose-soft);
    padding: 14px 16px;
    font-family: var(--font-sans);
  }
  .prop-draft-label {
    font-family: var(--font-mono);
    font-size: 0.67rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rose);
    margin-bottom: 6px;
  }
  .prop-draft-text {
    font-size: 0.93rem;
    line-height: 1.56;
    color: var(--text-main);
  }

  /* Choices Section — Pure, Zero Spoilers / Zero Subtitles */
  .choices-wrap {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeUp 0.42s 0.06s ease both;
  }
  .choice-btn {
    width: 100%;
    text-align: left;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 18px;
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(10px);
  }
  .choice-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-elevated);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
  }
  .choice-btn:active { transform: scale(0.993); }
  .choice-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    margin-top: 1px;
    border-radius: 7px;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 0.74rem;
    font-weight: 600;
    display: grid;
    place-items: center;
  }
  .choice-title {
    font-family: var(--font-sans);
    font-size: 0.96rem;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-main);
  }

  .below-choices {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .text-link-btn {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    cursor: pointer;
    padding: 6px 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s ease;
  }
  .text-link-btn:hover { color: var(--accent); }
  .text-link-btn:disabled { opacity: 0.35; pointer-events: none; }

  /* Ending Card */
  .ending-card {
    margin-top: 24px;
    padding: 28px 24px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, var(--accent-soft), var(--surface));
    border: 1px solid var(--border-strong);
    text-align: center;
    animation: fadeUp 0.55s ease both;
  }
  .ending-badge {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .ending-title {
    font-family: var(--font-serif);
    font-size: clamp(1.55rem, 4.4vw, 2.15rem);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .ending-subtitle {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--text-soft);
    margin: 0 0 22px;
    font-size: 1.03rem;
    line-height: 1.5;
  }
  .recap-box {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin: 0 0 16px;
  }
  .recap-title {
    font-family: var(--font-mono);
    font-size: 0.71rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .domino-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .domino-item {
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--text-soft);
    padding-left: 12px;
    border-left: 2px solid var(--border-strong);
  }
  .domino-item strong {
    display: block;
    color: var(--text-main);
    font-size: 0.85rem;
    margin-bottom: 2px;
  }
  .ending-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 18px;
  }
  .ending-actions button { width: auto; min-width: 165px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 13, 0.72);
    backdrop-filter: blur(6px);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-panel {
    width: 100%;
    max-width: 580px;
    max-height: 86dvh;
    overflow-y: auto;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 22px 26px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.25s ease both;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    font-weight: 500;
    margin: 0;
  }
  .modal-section-label {
    font-family: var(--font-mono);
    font-size: 0.69rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 18px 0 9px;
  }
  .ending-grid { display: grid; gap: 8px; }
  .ending-item {
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .ending-item.unlocked {
    border-color: var(--border-strong);
    background: var(--accent-soft);
  }
  .ending-item-head {
    font-size: 0.89rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 3px;
  }
  .ending-item-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .notes-list {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.87rem;
    line-height: 1.48;
    color: var(--text-soft);
  }
  .replay-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .pill-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-main);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.79rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .pill-btn:hover {
    border-color: var(--border-strong);
    color: var(--accent);
  }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.81rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    z-index: 80;
    transition: opacity 0.24s ease, transform 0.24s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .app-shell { padding: 14px 12px 74px; }
    .story-card { padding: 20px 17px; }
    .choice-btn { padding: 13px 14px; gap: 11px; }
    .choice-title { font-size: 0.93rem; }
  }
</style>
</head>
<body>
<canvas id="ambient-canvas" aria-hidden="true"></canvas>

<header id="topbar" class="topbar hidden">
  <div class="topbar-inner">
    <div class="scene-meta">
      <div id="top-chapter" class="scene-chapter">CHAPTER I</div>

    </div>

        <svg id="audio-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <svg id="audio-icon-on" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span class="btn-label">Sound</span>
      </button>
      <button id="btn-size" class="icon-btn" title="Text Size (S/M/L)">
        <span style="font-family:var(--font-serif);font-weight:600">Aa</span>
      </button>
      <button id="btn-theme" class="icon-btn" title="Switch Theme (Dusk / Paper)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
      <button id="btn-home" class="icon-btn" title="Title Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>

  </div>
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
</header>

<main id="app" class="app-shell"></main>

<div id="journal-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-panel">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">Raghav’s Notebook &amp; Timelines</h2>
      <button id="btn-close-modal" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {
  "use strict";

  const SAVE_KEY = "nothing_before_may_save_v1";
  const META_KEY = "nothing_before_may_meta_v1";

  const ENDINGS_CATALOG = [
    { id: "ending_1", num: "I", title: "Empty Platform at Rajiv Chowk", desc: "You accepted warmth when you were tired of waiting, cut off what you couldn't resolve, and watched two intense people bruise each other until nothing stayed." },
    { id: "ending_2", num: "II", title: "Quiet Terms, Cold Tea", desc: "Clarity came on Navya's terms—calm, unsparing, and months too late or built on an uneven pedestal." },
    { id: "ending_3", num: "III", title: "Only What We Actually Said", desc: "You let go of guessing, honored someone else's boundary even when it hurt, and walked into winter without hiding behind a rank." },
    { id: "ending_4", num: "IV", title: "Two Stubborn People Learning the Room", desc: "You didn't use Ahana as a bandage for another girl's silence—and when February hit hard, neither of you ran." },
    { id: "ending_5", num: "V", title: "Paper Weight", desc: "Avoidance, wounded pride, and half-truths bled through the mocks and the friendships until November left you staring at cold numbers." },
    { id: "ending_6", num: "VI", title: "Without Looking Away", desc: "You didn't buy comfort you couldn't love cleanly, kept faith with your friends, and finally looked in the mirror without negotiating." }
  ];

  function freshState() {
    return {
      catPrep: 2,
      navyaCloseness: 0,
      navyaTrust: 0,
      ahanaBond: 0,
      ahanaHope: 0,
      brotherhood: 2,
      selfWorth: 0,
      flags: {
        c1_seat: null,
        c1_startup_stance: null,
        c1_first_talk: null,
        c1_night_action: null,
        c2_saturday_plan: null,
        c2_navya_opened: false,
        c2_vent_choice: null,
        c2_midnight_reply: null,
        c3_girish_help: null,
        c3_navya_meet: null,
        c3_ahana_answer: null,
        c3_navya_clocked_leak: false,
        c3_ahana_night: null,
        c4_varun_choice: null,
        c4_intern_blowback: false,
        c4_shekhar_talk: null,
        c4_navya_oct: null,
        c4_navya_distanced: false,
        c4_diwali: null,
        c5_eve_text: null,
        c5_pre_cat_move: null,
        c5_cat_percentile: "98.4",
        c5_cat_score_num: 98.4,
        c6_route: null,
        c6_ahana_answer: null,
        c6_cut_navya: null,
        c7_jan_trigger: null,
        c7_feb_choice: null
      },
      notes: [],
      dominoes: [],
      wordsRead: 0
    };
  }

  function addNote(s, text) {
    if (!s.notes.includes(text)) s.notes.push(text);
  }

  function addDomino(s, chapter, choice, ripple) {
    if (!s.dominoes.some(d => d.choice === choice)) {
      s.dominoes.push({ chapter, choice, ripple });
    }
  }

  function cloneState(s) {
    return JSON.parse(JSON.stringify(s));
  }

  function computeCatPercentile(s) {
    const prep = Math.max(0, Math.min(10, s.catPrep));
    const bonus = s.flags.c5_eve_text === "phone_off" ? 0.45 : s.flags.c5_eve_text === "heavy_talk" ? -0.55 : 0;
    const raw = 90.2 + prep * 0.96 + bonus;
    const clamped = Math.max(89.1, Math.min(99.84, raw));
    return Number(clamped.toFixed(2));
  }

  function formatMocks(s) {
    const total = computeCatPercentile(s);
    const varc = Math.min(99.7, Number((total - 0.8 + (s.ahanaBond > 2 ? 0.9 : 0)).toFixed(1)));
    const dilr = Math.min(99.6, Number((total - 1.4 + (s.catPrep >= 6 ? 1.1 : -0.4)).toFixed(1)));
    const qa = Math.min(99.9, Number((total + 0.3 + (s.navyaCloseness >= 3 ? 0.2 : 0)).toFixed(1)));
    return {
      overall: total.toFixed(2) + "%ile",
      varc: varc.toFixed(1) + "%ile",
      dilr: dilr.toFixed(1) + "%ile",
      qa: qa.toFixed(1) + "%ile",
      num: total
    };
  }

  function loadMeta() {
    try {
      const raw = localStorage.getItem(META_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { unlockedEndings: [], theme: "night", size: "m", reducedMotion: false };
  }

  function saveMeta(m) {
    try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (_) {}
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return null;
  }

  function writeSave() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        sceneId: runtime.sceneId,
        state: runtime.state,
        history: runtime.history.slice(-45),
        lastChapterBanner: runtime.lastChapterBanner
      }));
    } catch (_) {}
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
  }

  const meta = loadMeta();
  document.documentElement.setAttribute("data-theme", meta.theme || "night");
  document.documentElement.setAttribute("data-size", meta.size || "m");
  if (meta.reducedMotion) document.body.classList.add("reduced-motion");

  const runtime = {
    view: "title",
    sceneId: "c1_arrival",
    state: freshState(),
    history: [],
    lastChapterBanner: 0,
    currentChoices: []
  };

  /* ---------------- Web Audio Adaptive Delhi Ambience ---------------- */
  const ambientAudio = {
    ctx: null,
    master: null,
    filter: null,
    playing: false,
    toggle() {
      if (this.playing) { this.stop(); return false; }
      this.start();
      return true;
    },
    start() {
      try {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          const bufferSize = this.ctx.sampleRate * 3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.997 * b0 + white * 0.028;
            b1 = 0.985 * b1 + white * 0.031;
            b2 = 0.950 * b2 + white * 0.045;
            data[i] = (b0 + b1 + b2 + white * 0.06) * 0.42;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;

          this.filter = this.ctx.createBiquadFilter();
          this.filter.type = "lowpass";
          this.filter.frequency.value = 600;

          this.master = this.ctx.createGain();
          this.master.gain.value = 0.0001;

          src.connect(this.filter);
          this.filter.connect(this.master);
          this.master.connect(this.ctx.destination);
          src.start();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
        this.playing = true;
        this.setSeason(document.documentElement.getAttribute("data-season") || "summer");
      } catch (_) {
        showToast("Audio unavailable in this browser.");
      }
    },
    stop() {
      if (this.ctx && this.master) {
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.4);
      }
      this.playing = false;
    },
    setSeason(season) {
      if (!this.ctx || !this.filter || !this.playing) return;
      const freqMap = { summer: 380, monsoon: 1250, autumn: 520, winter: 300 };
      const gainMap = { summer: 0.11, monsoon: 0.22, autumn: 0.12, winter: 0.08 };
      const t = this.ctx.currentTime;
      this.filter.frequency.linearRampToValueAtTime(freqMap[season] || 520, t + 1.1);
      this.master.gain.linearRampToValueAtTime(gainMap[season] || 0.12, t + 1.1);
    }
  };

  /* ---------------- Subtle Seasonal Canvas ---------------- */
  (() => {
    const canvas = document.getElementById("ambient-canvas");
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, dpr = 1;
    const particles = [];
    const COUNT = 72;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 1 + Math.random() * 1.8,
        len: 10 + Math.random() * 18,
        speed: 4 + Math.random() * 7,
        drift: (Math.random() - 0.5) * 0.45,
        alpha: 0.07 + Math.random() * 0.18
      });
    }

    function tick() {
      if (!document.body.classList.contains("reduced-motion")) {
        ctx.clearRect(0, 0, w, h);
        const season = document.documentElement.getAttribute("data-season") || "summer";
        const isPaper = document.documentElement.getAttribute("data-theme") === "paper";

        if (season === "monsoon") {
          ctx.lineWidth = 1;
          for (let i = 0; i < COUNT; i++) {
            const p = particles[i];
            ctx.strokeStyle = isPaper ? `rgba(105,88,72,${p.alpha * 0.6})` : `rgba(186,208,236,${p.alpha})`;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - 1.6, p.y + p.len);
            ctx.stroke();
            p.x -= 0.95;
            p.y += p.speed * 1.05;
            if (p.y > h + 20) { p.y = -25; p.x = Math.random() * (w + 60); }
          }
        } else {
          const moteCount = season === "winter" ? 36 : 28;
          for (let i = 0; i < moteCount; i++) {
            const p = particles[i];
            const color = isPaper
              ? `rgba(110,82,50,${p.alpha * 0.5})`
              : season === "winter"
                ? `rgba(200,214,235,${p.alpha * 0.55})`
                : `rgba(232,190,126,${p.alpha * 0.55})`;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            p.x += p.drift;
            p.y += season === "winter" ? 0.25 : -0.18;
            if (p.y < -10) p.y = h + 10;
            if (p.y > h + 10) p.y = -10;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
          }
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ---------------- UI Helpers ---------------- */
  const appEl = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const topChapter = document.getElementById("top-chapter");
  const topLocation = document.getElementById("top-location");
  const progressFill = document.getElementById("progress-fill");
  const modalBackdrop = document.getElementById("journal-modal");
  const modalBody = document.getElementById("modal-body");

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatRich(str) {
    return String(str);
  }

  function countWordsInBlocks(blocks) {
    let words = 0;
    for (const b of blocks) {
      if (b.text) words += b.text.replace(/<[^>]+>/g, "").trim().split(/\s+/).length;
      if (b.messages) {
        for (const m of b.messages) words += (m.text || "").trim().split(/\s+/).length;
      }
      if (b.data && b.data.body) words += b.data.body.replace(/<[^>]+>/g, "").trim().split(/\s+/).length;
    }
    return words;
  }

  function renderBlock(b) {
    if (b.type === "p") {
      return `<p class="prose-block">${formatRich(b.text)}</p>`;
    }
    if (b.type === "quote") {
      return `<blockquote class="prose-quote">${formatRich(b.text)}</blockquote>`;
    }
    if (b.type === "divider") {
      return `<div class="scene-divider" aria-hidden="true">· · ·</div>`;
    }
    if (b.type === "chat") {
      const msgs = b.messages.map(m => {
        if (m.day) return `<div class="chat-day-pill">${escapeHtml(m.day)}</div>`;
        const cls = m.from === "me" ? "me" : "them";
        const deletedCls = m.deleted ? " deleted" : "";
        const ticks = m.from === "me" ? (m.read === false ? " ✓✓" : " ✓✓") : "";
        return `
          <div class="bubble ${cls}${deletedCls}">
            ${m.sender ? `<span class="bubble-sender">${escapeHtml(m.sender)}</span>` : ""}
            ${escapeHtml(m.text)}
            ${m.time ? `<span class="bubble-time">${escapeHtml(m.time)}${ticks}</span>` : ""}

                <div class="prop-mock-val">${escapeHtml(d.qa || "")}</div>
              </div>
            </div>
            ${d.note ? `<div class="prop-mock-note">${formatRich(d.note)}</div>` : ""}
          </div>`;
      }
      if (b.kind === "note") {
        return `
          <div class="prop-note">
            <div class="prop-note-meta">
              <span>${escapeHtml(d.label || "NOTES")}</span>
              <span>${escapeHtml(d.time || "")}</span>
            </div>
            <div class="prop-note-body">${formatRich(d.body || "")}</div>
          </div>`;
      }
      if (b.kind === "email") {
        return `
          <div class="prop-email">
            <div class="prop-email-label">${escapeHtml(d.label || "INBOX")}</div>
            <div class="prop-email-subject">${escapeHtml(d.subject || "")}</div>
            <div class="prop-email-from">${escapeHtml(d.from || "")}</div>

      if (b.kind === "draft") {
        return `
          <div class="prop-draft">

            <div class="prop-draft-text">${formatRich(d.body || "")}</div>
          </div>`;
      }
    }
    return "";
  }

  function renderScene() {
    const scene = STORY[runtime.sceneId];
    if (!scene) {
      showToast("Scene missing: " + runtime.sceneId);
      return;
    }

    runtime.view = "game";
    topbar.classList.remove("hidden");

    const season = scene.season || "summer";
    document.documentElement.setAttribute("data-season", season);
    ambientAudio.setSeason(season);

    const roman = ["", "I", "II", "III", "IV", "V", "VI", "VII"][scene.chapter] || scene.chapter;
    topChapter.textContent = `CHAPTER ${roman} · ${scene.chapterTitle.toUpperCase()}`;
    topLocation.textContent = scene.location || "DELHI";
    progressFill.style.width = `${Math.min(100, Math.max(2, scene.progress || 0))}%`;

    const showBanner = scene.chapter && scene.chapter !== runtime.lastChapterBanner;
    if (showBanner) runtime.lastChapterBanner = scene.chapter;

    const blocks = typeof scene.body === "function" ? scene.body(runtime.state) : scene.body;
    const rawChoices = typeof scene.choices === "function" ? scene.choices(runtime.state) : (scene.choices || []);
    const visibleChoices = rawChoices.filter(c => !c.condition || c.condition(runtime.state));
    runtime.currentChoices = visibleChoices;

    let endingHtml = "";
    if (scene.ending) {
      if (!meta.unlockedEndings.includes(scene.ending.id)) {
        meta.unlockedEndings.push(scene.ending.id);
        saveMeta(meta);
      }

      const dominoHtml = runtime.state.dominoes.length
        ? runtime.state.dominoes.map(d => `
            <li class="domino-item">
              <strong>${escapeHtml(d.chapter)} — ${escapeHtml(d.choice)}</strong>
              ${escapeHtml(d.ripple)}
            </li>`).join("")
        : `<li class="domino-item">You moved through the year quietly, leaving few visible marks until winter settled.</li>`;

      const notesHtml = runtime.state.notes.length
        ? runtime.state.notes.map(n => `<li>${escapeHtml(n)}</li>`).join("")
        : `<li>No entries kept.</li>`;

      endingHtml = `
        <div class="ending-card">
          <div class="ending-badge">TIMELINE ${escapeHtml(scene.ending.num)} OF VI</div>
          <h2 class="ending-title">${escapeHtml(scene.ending.title)}</h2>
          <p class="ending-subtitle">${escapeHtml(scene.ending.subtitle)}</p>

          <div class="recap-box">
            <div class="recap-title">How This Timeline Formed (${runtime.state.dominoes.length} Turning Points)</div>
            <ul class="domino-list">${dominoHtml}</ul>
          </div>

          <div class="recap-box">
            <div class="recap-title">Year in Notes · Final CAT Estimate: ${escapeHtml(formatMocks(runtime.state).overall)}</div>
            <ul class="notes-list">${notesHtml}</ul>
          </div>

          <div class="ending-actions">
            <button id="btn-end-replay" class="primary-btn">Start Again in May</button>
            <button id="btn-end-gallery" class="secondary-btn">Timelines (${meta.unlockedEndings.length}/6)</button>
            <button id="btn-end-copy" class="secondary-btn">Copy Result</button>
          </div>
        </div>`;
    }

    const choicesHtml = visibleChoices.length
      ? `<div class="choices-wrap">
          ${visibleChoices.map((c, idx) => `
            <button class="choice-btn" data-idx="${idx}">
              <span class="choice-num">${idx + 1}</span>
              <span class="choice-title">${formatRich(c.text)}</span>
            </button>
          `).join("")}
        </div>`
      : "";

    const bannerHtml = showBanner
      ? `<div class="chapter-banner">
           <div class="chapter-banner-num">Chapter ${roman}</div>
           <h2 class="chapter-banner-title">${escapeHtml(scene.chapterTitle)}</h2>
         </div>`
      : "";

    appEl.innerHTML = `
      ${bannerHtml}
      <article class="story-stage">
        <div class="story-card">
          <div class="scene-tag">${escapeHtml(scene.location || "DELHI")}</div>
          ${blocks.map(renderBlock).join("")}
        </div>
        ${choicesHtml}
        ${endingHtml}
        <div class="below-choices">
          <button id="btn-undo" class="text-link-btn" ${runtime.history.length ? "" : "disabled"}>
            ← Step back
          </button>
          <span style="font-size:0.74rem;color:var(--text-muted);font-family:var(--font-mono)">
            ${runtime.state.notes.length} entries recorded
          </span>
        </div>
      </article>
    `;

    document.querySelectorAll(".choice-btn").forEach(btn => {
      btn.onclick = () => pickChoice(Number(btn.dataset.idx));
    });

    const undoBtn = document.getElementById("btn-undo");
    if (undoBtn) undoBtn.onclick = stepBack;

    if (scene.ending) {
      document.getElementById("btn-end-replay").onclick = () => {
        runtime.sceneId = "c1_arrival";
        runtime.state = freshState();
        runtime.history = [];
        runtime.lastChapterBanner = 0;
        writeSave();
        renderScene();
      };
      document.getElementById("btn-end-gallery").onclick = openJournal;
      document.getElementById("btn-end-copy").onclick = () => {
        const txt = `Nothing Before May — Timeline ${scene.ending.num}: "${scene.ending.title}" (CAT: ${formatMocks(runtime.state).overall})`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => showToast("Timeline summary copied.")).catch(() => showToast(txt));
        } else {
          showToast(txt);
        }
      };
    }

    writeSave();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function pickChoice(idx) {
    const choice = runtime.currentChoices[idx];
    if (!choice) return;

    const currentScene = STORY[runtime.sceneId];
    const blocks = typeof currentScene.body === "function" ? currentScene.body(runtime.state) : currentScene.body;

    runtime.history.push({
      sceneId: runtime.sceneId,
      state: cloneState(runtime.state),
      lastChapterBanner: runtime.lastChapterBanner
    });

    if (choice.effect) choice.effect(runtime.state);
    runtime.state.wordsRead += countWordsInBlocks(blocks);

    const nextId = typeof choice.next === "function" ? choice.next(runtime.state) : choice.next;
    runtime.sceneId = nextId;
    renderScene();
  }

  function stepBack() {
    if (!runtime.history.length) return;
    const prev = runtime.history.pop();
    runtime.sceneId = prev.sceneId;
    runtime.state = prev.state;
    runtime.lastChapterBanner = prev.lastChapterBanner;
    renderScene();
  }

  /* ---------------- Notebook & Post-Ending Replay Points ---------------- */

          <div class="ending-item-desc">
            ${isUnlocked ? escapeHtml(e.desc) : "Play through the year along different choices to find how this timeline unfolds."}
          </div>
        </div>`;
    }).join("");

    const notesHtml = notes.length
      ? `<ul class="notes-list">${notes.map(n => `<li>${escapeHtml(n)}</li>`).join("")}</ul>`
      : `<p style="font-size:0.85rem;color:var(--text-muted);margin:0;">Nothing recorded yet in this run.</p>`;

    const canJump = unlocked.length > 0;
    const jumpHtml = canJump ? `

        <button class="pill-btn" data-jump="c5_exam_eve">Ch V · Night Before CAT</button>
      </div>` : "";

    modalBody.innerHTML = `

    modalBody.querySelectorAll("[data-jump]").forEach(btn => {

        const s = freshState();

        if (target === "c4_khatabridge_ghost" || target === "c5_exam_eve") {
          s.flags.c3_girish_help = "helped";

          s.flags.c3_ahana_answer = "kept_strict";
        }
        if (target === "c5_exam_eve") {
          s.flags.c4_varun_choice = "paid_interns";
          s.flags.c4_shekhar_talk = "listened";
          s.flags.c4_diwali = "ahana_terrace";
        }
        addNote(s, "Resumed from a mid-year timeline checkpoint.");
        runtime.state = s;
        runtime.history = [];
        runtime.lastChapterBanner = 0;
        runtime.sceneId = target;
        closeJournal();
        renderScene();
      };
    });

    document.getElementById("btn-modal-restart").onclick = () => {
      runtime.sceneId = "c1_arrival";
      runtime.state = freshState();
      runtime.history = [];
      runtime.lastChapterBanner = 0;
      closeJournal();
      renderScene();
    };
    document.getElementById("btn-modal-clear").onclick = () => {
      clearSave();
      showToast("Saved slot cleared.");
    };

    modalBackdrop.classList.add("open");
  }

  function closeJournal() { modalBackdrop.classList.remove("open"); }

  function toggleTheme() {
    meta.theme = meta.theme === "night" ? "paper" : "night";
    document.documentElement.setAttribute("data-theme", meta.theme);
    saveMeta(meta);
    showToast(meta.theme === "paper" ? "Warm Paper" : "Dusk Study");
  }

  function cycleSize() {
    const order = ["s", "m", "l"];
    const next = order[(order.indexOf(meta.size || "m") + 1) % order.length];
    meta.size = next;
    document.documentElement.setAttribute("data-size", next);
    saveMeta(meta);
    showToast(`Text size: ${next.toUpperCase()}`);
  }

  function toggleAudio() {
    const on = ambientAudio.toggle();
    document.getElementById("btn-audio").classList.toggle("active", on);
    document.getElementById("audio-icon-on").style.display = on ? "inline" : "none";
    document.getElementById("audio-icon-off").style.display = on ? "none" : "inline";
    showToast(on ? "Ambience on" : "Ambience muted");
  }

  document.getElementById("btn-journal").onclick = openJournal;
  document.getElementById("btn-close-modal").onclick = closeJournal;
  modalBackdrop.onclick = (e) => { if (e.target === modalBackdrop) closeJournal(); };
  document.getElementById("btn-theme").onclick = toggleTheme;
  document.getElementById("btn-size").onclick = cycleSize;
  document.getElementById("btn-audio").onclick = toggleAudio;
  document.getElementById("btn-home").onclick = renderTitle;

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBackdrop.classList.contains("open")) {
      closeJournal();
      return;

    if (runtime.view !== "game" || modalBackdrop.classList.contains("open")) return;
