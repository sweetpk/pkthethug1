<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darshal-Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="base-styles">
/* ===== CSS VARIABLES (Tactical Slate & Cerulean Theme) ===== */
:root {
  --bg: #0c0f12;
  --bg2: #13181d;
  --bg3: #1b2229;
  --bg4: #232c35;
  --border: #2a343f;
  --border2: #394654;
  --text: #edf2f7;
  --text2: #9aa7b6;
  --text3: #647384;
  --accent: #0ea5e9;
  --accent2: #0284c7;
  --accent-hi: #2dd4bf;
  --accent-glow: rgba(14, 165, 233, 0.14);
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12);
  --red: #f43f5e;
  --red-bg: rgba(244, 63, 94, 0.12);
  --yellow: #f59e0b;
  --yellow-bg: rgba(245, 158, 11, 0.12);
  --blue: #38bdf8;
  --blue-bg: rgba(56, 189, 248, 0.12);
  --orange: #fb923c;
  --radius: 14px;
  --radius-sm: 9px;
  --radius-lg: 18px;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.38);
  --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.55);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg: #f3f5f7;
  --bg2: #ffffff;
  --bg3: #eaedf1;
  --bg4: #dfe4ea;
  --border: #cfd6df;
  --border2: #b8c2ce;
  --text: #10151c;
  --text2: #4b5766;
  --text3: #7b8898;
  --accent: #0284c7;
  --accent2: #0369a1;
  --accent-hi: #0d9488;
  --accent-glow: rgba(2, 132, 199, 0.1);
  --shadow: 0 4px 20px rgba(15, 23, 42, 0.07);
  --shadow-lg: 0 10px 40px rgba(15, 23, 42, 0.12);
}

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===== TOPBAR ===== */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 58px;
  background: rgba(12, 15, 18, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px;
  transition: background var(--transition);
}
[data-theme="light"] #topbar { background: rgba(243, 245, 247, 0.92); }
@media (max-width: 768px) {
  #topbar { backdrop-filter: none; background: rgba(12, 15, 18, 0.98); }
  [data-theme="light"] #topbar { background: rgba(243, 245, 247, 0.98); }
}
.topbar-logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-size: 1.08rem; font-weight: 700;
  letter-spacing: -0.02em; color: var(--text);
}
.topbar-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hi) 100%);
  display: flex; align-items: center; justify-content: center;
  color: #06131a; font-family: var(--font-mono);
  font-size: 0.78rem; font-weight: 700;
  box-shadow: 0 2px 10px rgba(14, 165, 233, 0.35);
}
.topbar-title-accent {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hi) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar-right { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text2); background: var(--bg3);
  border: 1px solid var(--border);
  font-size: 1rem; transition: all var(--transition);
}
@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover { color: var(--text); background: var(--bg4); border-color: var(--border2); }
}

/* ===== TOAST & LOADING ===== */
#toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--bg4); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 10px 18px;
  font-size: 0.85rem; font-weight: 500;
  opacity: 0; transition: all 0.28s ease;
  pointer-events: none; z-index: 300; white-space: nowrap;
  box-shadow: var(--shadow);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#loading-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
}
#loading-overlay.show { opacity: 1; pointer-events: all; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay p { color: var(--text2); font-size: 0.9rem; }

/* ===== LOGIN SCREEN ===== */
#screen-login {
  min-height: 100vh;
  padding: calc(58px + 24px) 18px 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
#screen-login::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background-image:
    radial-gradient(circle at 22% 20%, rgba(14, 165, 233, 0.1) 0%, transparent 45%),
    radial-gradient(circle at 80% 78%, rgba(45, 212, 191, 0.08) 0%, transparent 42%),
    radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 26px 26px;
  opacity: 0.78;
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px 28px 26px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-hi));
}
.login-card.shake {
  animation: login-shake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes login-shake {
  10%, 90% { transform: translateX(-3px); }
  20%, 80% { transform: translateX(5px); }
  30%, 50%, 70% { transform: translateX(-6px); }
  40%, 60% { transform: translateX(6px); }
}
.login-head {
  text-align: center;
  margin-bottom: 24px;
}
.login-shield {
  width: 52px; height: 52px;
  margin: 0 auto 14px;
  border-radius: 14px;
  background: var(--accent-glow);
  border: 1px solid rgba(14, 165, 233, 0.32);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
}
.login-head h1 {
  font-family: var(--font-display);
  font-size: 1.6rem; font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.login-head h1 span {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hi) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text2);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.login-badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-hi);
}
.login-field { margin-bottom: 16px; }
.login-label {
  display: block;
  font-size: 0.74rem; font-weight: 700;
  color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.login-input-wrap {
  position: relative;
  display: flex; align-items: center;
}
.login-input {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 11px 14px;
  font-size: 0.94rem;
  transition: all var(--transition);
}
.login-input.has-toggle { padding-right: 44px; }
.login-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg4);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.pass-toggle-btn {
  position: absolute; right: 8px;
  width: 32px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: 0.95rem;
  transition: all var(--transition);
}
.pass-toggle-btn:hover { color: var(--text); background: var(--bg4); }
.login-remember-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 18px;
  font-size: 0.8rem; color: var(--text2);
  cursor: pointer; user-select: none;
}
.login-remember-row input {
  width: 15px; height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}
.login-error {
  display: none;
  padding: 10px 13px;
  margin-bottom: 16px;
  border-radius: var(--radius-sm);
  background: var(--red-bg);
  border: 1px solid rgba(244, 63, 94, 0.3);
  color: var(--red);
  font-size: 0.82rem;
  font-weight: 500;
  line-height: 1.45;
}
.login-error.show { display: block; }
.login-btn {
  width: 100%;
  padding: 13px 20px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hi) 100%);
  color: #06131a;
  font-family: var(--font-display);
  font-size: 0.98rem; font-weight: 700;
  transition: all var(--transition);
  box-shadow: 0 4px 18px rgba(14, 165, 233, 0.28);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.login-btn:disabled {
  opacity: 0.5; cursor: not-allowed; box-shadow: none;
}
@media (hover: hover) and (pointer: fine) {
  .login-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(14, 165, 233, 0.42); }
}
.login-footer {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 0.76rem;
  color: var(--text3);
}
</style>
</head>

        </div>
      </div>

      <label class="login-remember-row">
        <input type="checkbox" id="login-remember">
        <span>Keep unlocked on refresh (this tab only)</span>
      </label>

      <div class="login-error" id="login-error" role="alert"></div>

      <button type="submit" class="login-btn" id="login-submit">
        <span>Unlock &amp; Enter →</span>
      </button>
    </form>

    <div class="login-footer">Made by Pratik Kumar for his brothers.</div>
  </div>
</div>

<!-- Encrypted App Mount Point (empty until credentials decrypt APP_VAULT) -->
<div id="app-mount"></div>

(() => {
const THEME_KEY = 'dt_theme';
const AUTH_GUARD_KEY = 'dt_auth_guard';

const el = id => document.getElementById(id);

let outerToastTimer = null;
function toastMsg(msg, duration = 2200) {
  const t = el('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(outerToastTimer);
  outerToastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

function toggleTheme() {
  const curr = document.body.dataset.theme;
  const next = curr === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = next;
  el('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, next);
}

(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'light' || saved === 'dark') {
    document.body.dataset.theme = saved;
    el('theme-toggle').textContent = saved === 'dark' ? '🌙' : '☀️';
  }
  el('theme-toggle').addEventListener('click', toggleTheme);
})();

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToHex(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
  return s;
}

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
  return out;
}

function constTimeEq(a, b) {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= (a[i] ^ b[i]);
  return diff === 0;
}

  ]);
  const RCON = [0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1b,0x36];
  function xtime(a) { return ((a << 1) ^ ((a & 0x80) ? 0x1b : 0)) & 0xff; }

  function expandKey(key) {
    const rk = new Uint8Array(240);
    rk.set(key, 0);
    let i = 8;
    const tmp = new Uint8Array(4);
    while (i < 60) {
      tmp.set(rk.subarray((i - 1) * 4, i * 4));
      if (i % 8 === 0) {
        const t = tmp[0];
        tmp[0] = SBOX[tmp[1]] ^ RCON[i / 8 - 1];
        tmp[1] = SBOX[tmp[2]]; tmp[2] = SBOX[tmp[3]]; tmp[3] = SBOX[t];
      } else if (i % 8 === 4) {
        tmp[0] = SBOX[tmp[0]]; tmp[1] = SBOX[tmp[1]]; tmp[2] = SBOX[tmp[2]]; tmp[3] = SBOX[tmp[3]];
      }
      for (let j = 0; j < 4; j++) rk[i * 4 + j] = rk[(i - 8) * 4 + j] ^ tmp[j];
      i++;
    }
    return rk;
  }

  function encryptBlock(block, rk) {
    const s = new Uint8Array(block);
    for (let i = 0; i < 16; i++) s[i] ^= rk[i];
    for (let r = 1; r <= 14; r++) {
      for (let i = 0; i < 16; i++) s[i] = SBOX[s[i]];
      let t = s[1]; s[1]=s[5]; s[5]=s[9]; s[9]=s[13]; s[13]=t;
      t = s[2]; s[2]=s[10]; s[10]=t; t = s[6]; s[6]=s[14]; s[14]=t;
      t = s[15]; s[15]=s[11]; s[11]=s[7]; s[7]=s[3]; s[3]=t;
      if (r < 14) {
        for (let c = 0; c < 4; c++) {
          const idx = c * 4;
          const a0=s[idx], a1=s[idx+1], a2=s[idx+2], a3=s[idx+3];
          const xr = a0 ^ a1 ^ a2 ^ a3;
          s[idx]   ^= xr ^ xtime(a0 ^ a1);
          s[idx+1] ^= xr ^ xtime(a1 ^ a2);
          s[idx+2] ^= xr ^ xtime(a2 ^ a3);
          s[idx+3] ^= xr ^ xtime(a3 ^ a0);
        }
      }
      const roff = r * 16;
      for (let i = 0; i < 16; i++) s[i] ^= rk[roff + i];
    }
    return s;
  }

  function aes256Ctr(key, iv, data) {
    const rk = expandKey(key);
    const ctr = new Uint8Array(iv);
    const out = new Uint8Array(data.length);
    for (let off = 0; off < data.length; off += 16) {
      const ks = encryptBlock(ctr, rk);
      const end = Math.min(16, data.length - off);
      for (let i = 0; i < end; i++) out[off + i] = data[off + i] ^ ks[i];
      for (let i = 15; i >= 8; i--) { ctr[i] = (ctr[i] + 1) & 0xff; if (ctr[i] !== 0) break; }
    }
    return out;
  }

  return { pbkdf2Sha256, hmacSha256, aes256Ctr };
})();

async function deriveKeysFromCredentials(username, password) {
  const secretBytes = new TextEncoder().encode(username.trim() + '\u0000' + password);
  const salt = b64ToBytes(APP_VAULT.salt);

  let dk;
  if (window.crypto && window.crypto.subtle) {
    const baseKey = await window.crypto.subtle.importKey('raw', secretBytes, 'PBKDF2', false, ['deriveBits']);
    dk = new Uint8Array(await window.crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: APP_VAULT.iter, hash: 'SHA-256' },
      baseKey,
      512
    ));
  } else {
    dk = PureCrypto.pbkdf2Sha256(secretBytes, salt, APP_VAULT.iter, 64);
  }
  return { encKey: dk.slice(0, 32), macKey: dk.slice(32, 64) };
}

async function decryptVaultWithKeys(encKey, macKey) {
  const iv = b64ToBytes(APP_VAULT.iv);
  const ct = b64ToBytes(APP_VAULT.data);
  const expectedTag = b64ToBytes(APP_VAULT.tag);

  const ivAndCt = new Uint8Array(iv.length + ct.length);
  ivAndCt.set(iv, 0);
  ivAndCt.set(ct, iv.length);

  let pt;
  if (window.crypto && window.crypto.subtle) {
    const wMacKey = await window.crypto.subtle.importKey('raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const valid = await window.crypto.subtle.verify('HMAC', wMacKey, expectedTag, ivAndCt);
    if (!valid) return null;
    const wEncKey = await window.crypto.subtle.importKey('raw', encKey, { name: 'AES-CTR' }, false, ['decrypt']);
    pt = new Uint8Array(await window.crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, wEncKey, ct));
  } else {
    const actualTag = PureCrypto.hmacSha256(macKey, ivAndCt);
    if (!constTimeEq(actualTag, expectedTag)) return null;
    pt = PureCrypto.aes256Ctr(encKey, iv, ct);
  }

  return JSON.parse(new TextDecoder().decode(pt));
}

function mountUnlockedApp(payload) {
  const loginEl = el('screen-login');
  if (loginEl) loginEl.remove();

  const styleEl = document.createElement('style');
  styleEl.id = 'app-dynamic-style';
  styleEl.textContent = payload.css;
  document.head.appendChild(styleEl);

  el('app-mount').innerHTML = payload.html;
  el('lock-btn').style.display = 'flex';

  const scriptEl = document.createElement('script');
  scriptEl.textContent = payload.js;
  document.body.appendChild(scriptEl);
}

let lockoutTimer = null;

function getAuthGuard() {
  try {
    const raw = JSON.parse(localStorage.getItem(AUTH_GUARD_KEY) || '{}');
    return { fails: Number(raw.fails) || 0, lockUntil: Number(raw.lockUntil) || 0 };
  } catch {
    return { fails: 0, lockUntil: 0 };
  }
}

function setAuthGuard(guard) {
  localStorage.setItem(AUTH_GUARD_KEY, JSON.stringify(guard));
}

function clearAuthGuard() {
  localStorage.removeItem(AUTH_GUARD_KEY);
}

function showLoginError(msg) {
  const errEl = el('login-error');
  errEl.textContent = msg;
  errEl.classList.add('show');
}

function hideLoginError() {
  const errEl = el('login-error');
  errEl.textContent = '';
  errEl.classList.remove('show');
}

function shakeLoginCard() {
  const card = el('login-card');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
}

function syncLockoutBanner() {
  clearInterval(lockoutTimer);
  const submitBtn = el('login-submit');
  const guard = getAuthGuard();
  const now = Date.now();

  if (guard.lockUntil > now) {
    submitBtn.disabled = true;
    const tick = () => {
      const rem = Math.ceil((guard.lockUntil - Date.now()) / 1000);
      if (rem <= 0) {
        clearInterval(lockoutTimer);
        submitBtn.disabled = false;
        hideLoginError();
        return;
      }
      showLoginError(`Too many failed attempts. Try again in ${rem}s.`);
    };
    tick();
    lockoutTimer = setInterval(tick, 500);
    return true;
  }
  submitBtn.disabled = false;
  return false;
}

el('lock-btn').addEventListener('click', () => {
  if (typeof window.clearTimers === 'function') window.clearTimers();
  sessionStorage.removeItem(TAB_SESSION_KEY);
  location.reload();
});

el('toggle-pass-vis').addEventListener('click', () => {
  const inp = el('login-pass');
  const btn = el('toggle-pass-vis');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.title = show ? 'Hide password' : 'Show password';
  btn.setAttribute('aria-label', btn.title);
});

el('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (syncLockoutBanner()) return;

  const user = el('login-user').value;
  const pass = el('login-pass').value;
  const submitBtn = el('login-submit');

  hideLoginError();
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>Verifying…</span>';

  await new Promise(r => setTimeout(r, 25));

  try {
    const { encKey, macKey } = await deriveKeysFromCredentials(user, pass);
    const payload = await decryptVaultWithKeys(encKey, macKey);

    if (!payload) {
      const guard = getAuthGuard();
      guard.fails += 1;
      if (guard.fails >= 5) {
        const penaltySec = Math.min(300, 30 * Math.pow(2, guard.fails - 5));
        guard.lockUntil = Date.now() + penaltySec * 1000;
      }
      setAuthGuard(guard);
      shakeLoginCard();
      el('login-pass').value = '';
      el('login-pass').focus();

      if (!syncLockoutBanner()) {
        const left = 5 - guard.fails;
        showLoginError(`Invalid username or password. (${left} attempt${left === 1 ? '' : 's'} remaining before cooldown)`);
      }
      return;
    }

    clearAuthGuard();
    el('login-pass').value = '';

    if (el('login-remember').checked) {
      sessionStorage.setItem(TAB_SESSION_KEY, JSON.stringify({
        enc: bytesToHex(encKey),
        mac: bytesToHex(macKey),
      }));
    } else {
      sessionStorage.removeItem(TAB_SESSION_KEY);
    }

    mountUnlockedApp(payload);
    toastMsg('🔓 Unlocked Darshal-Test');
  } catch {
    showLoginError('Unable to verify credentials.');
  } finally {
    if (el('login-submit')) {
      const stillLocked = getAuthGuard().lockUntil > Date.now();
      el('login-submit').disabled = stillLocked;
      el('login-submit').innerHTML = '<span>Unlock &amp; Enter →</span>';
    }
  }
});

(async function checkTabSession() {
  syncLockoutBanner();
  const raw = sessionStorage.getItem(TAB_SESSION_KEY);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed.enc || !parsed.mac) throw new Error('Invalid session');
    const payload = await decryptVaultWithKeys(hexToBytes(parsed.enc), hexToBytes(parsed.mac));
    if (payload) {
      mountUnlockedApp(payload);
      return;
    }
  } catch { /* fall through to login screen */ }
  sessionStorage.removeItem(TAB_SESSION_KEY);
})();
})();
