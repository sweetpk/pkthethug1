<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REELTALE — Flash Fiction Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cormorant+Garamond:ital,wght@0,500;1,600&family=Lora:ital,wght@0,400;1,400&family=Poppins:ital,wght@0,700;0,800;1,800&family=Nunito:wght@500;700;800&family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;1,500&family=Special+Elite&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ui-display:'Poppins',sans-serif;
    --ui-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--ui-body);
    background:#0b0b0d;
    color:#f2f0ee;
    overflow:hidden;
    height:100dvh;
    width:100vw;
  }
  #app{position:relative;width:100%;height:100dvh;}
  .hidden{display:none !important;}

  /* ================= GENRE SELECT SCREEN ================= */
  #genre-screen{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    background:
      radial-gradient(circle at 20% 15%, rgba(233,120,140,.18), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(120,180,230,.15), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(230,190,110,.12), transparent 40%),
      #0b0b0d;
  }
  .brand{
    font-family:var(--ui-display);
    font-weight:800;
    font-style:italic;
    font-size:clamp(30px,7vw,42px);
    letter-spacing:.5px;
    margin:0 0 6px;
    background:linear-gradient(100deg,#f2f0ee,#e9788c 45%,#e6be6e 75%,#f2f0ee);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand-sub{
    font-size:14px;
    color:#9a978f;
    margin:0 0 40px;
    text-align:center;
    max-width:320px;
    line-height:1.5;
  }
  .genre-prompt{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:#c9c6bd;
    margin:0 0 16px;
    font-weight:600;
  }
  .genre-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
    max-width:380px;
    min-height:40px;
  }
  .genre-status{
    font-size:12.5px;
    color:#9a978f;
    margin:16px 0 0;
    text-align:center;
    max-width:320px;
    line-height:1.55;
  }
  .genre-status.error{color:#e9788c;}
  .genre-status code{
    background:rgba(255,255,255,.08);
    padding:1px 6px;
    border-radius:5px;
    font-size:11.5px;
  }
  .genre-card{
    position:relative;
    border-radius:18px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    border:1.5px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03);
    transition:transform .15s ease, border-color .2s ease, background .2s ease;
    user-select:none;
  }
  .genre-card:active{transform:scale(.96);}
  .genre-card .g-icon{font-size:26px;display:block;margin-bottom:8px;}
  .genre-card .g-name{
    font-family:var(--ui-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.3px;
  }
  .genre-card .g-tag{
    display:block;
    font-size:11px;
    color:#8f8c85;
    margin-top:3px;
  }
  .genre-card[data-g="romance"]{background:linear-gradient(150deg,rgba(229,143,160,.10),rgba(255,255,255,.02));}
  .genre-card[data-g="comedy"]{background:linear-gradient(150deg,rgba(255,180,84,.12),rgba(255,255,255,.02));}
  .genre-card[data-g="fantasy"]{background:linear-gradient(150deg,rgba(89,195,180,.10),rgba(255,255,255,.02));}
  .genre-card[data-g="mystery"]{background:linear-gradient(150deg,rgba(154,48,64,.14),rgba(255,255,255,.02));}
  .genre-card.selected{
    border-color:#e9788c;
    background:rgba(233,120,140,.14);
    box-shadow:0 0 0 1px rgba(233,120,140,.4) inset, 0 8px 20px -10px rgba(233,120,140,.5);
  }
  .genre-card.selected .check{
    opacity:1;
    transform:scale(1);
  }
  .check{
    position:absolute;
    top:8px;
    right:8px;
    width:20px;height:20px;
    border-radius:50%;
    background:#e9788c;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:scale(.5);
    transition:all .18s ease;
  }
  .check svg{width:11px;height:11px;stroke:#1a0e10;}

  #start-btn{
    margin-top:30px;
    padding:15px 42px;
    border-radius:30px;
    border:none;
    font-family:var(--ui-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.4px;
    background:#2a2a2e;
    color:#6f6c66;
    cursor:not-allowed;
    transition:all .25s ease;
  }
  #start-btn.ready{
    background:linear-gradient(100deg,#e9788c,#e6be6e);
    color:#1a0e10;
    cursor:pointer;
    box-shadow:0 10px 24px -10px rgba(233,120,140,.6);
  }
  #start-btn.ready:active{transform:scale(.97);}

  /* ================= STAGE (holds phone frame + desktop arrows) ================= */
  #stage{
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    background:#0b0b0d;
  }
  .phone-frame{
    position:relative;
    width:100%;
    height:100dvh;
    max-width:460px;
    max-height:960px;
    overflow:hidden;
    background:#000;
    box-shadow:none;
  }
  @media (min-width:760px){
    .phone-frame{
      width:420px;
      height:min(88vh,880px);
      border-radius:32px;
      box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 8px #17171a, 0 0 0 9px rgba(255,255,255,.06);
    }
  }

  .reel{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#15151a;
    transition:background 0.5s ease;
  }
  .reel::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:linear-gradient(to bottom, rgba(0,0,0,.24) 0%, transparent 20%, transparent 66%, rgba(0,0,0,.42) 100%);
  }
  .reel-surface{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
  }

  /* progress segments */
  .progress-row{
    display:flex;
    gap:5px;
    padding:14px 14px 0;
    position:relative;
    z-index:5;
  }
  .seg{
    flex:1;
    height:3px;
    border-radius:3px;
    background:rgba(255,255,255,.25);
    overflow:hidden;
  }
  .seg i{
    display:block;
    height:100%;
    width:0%;
    background:#fff;
    transition:width .35s ease;
  }

  .top-bar{
    position:relative;
    z-index:5;
    padding:14px 18px 0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .genre-pill{
    font-size:10px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(6px);
    font-weight:700;
    font-family:var(--ui-display);
  }
  .story-title{
    margin:10px 18px 0;
    position:relative;
    z-index:5;
    font-size:22px;
    line-height:1.25;
    text-shadow:0 2px 14px rgba(0,0,0,.45);
    flex-shrink:0;
  }

  /* content row: text column + action rail column, side by side so they never overlap */
  .content-row{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:row;
    position:relative;
    z-index:4;
  }
  .slide-wrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    padding:6px 8px 6px 26px;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .slide-wrap::-webkit-scrollbar{display:none;}
  .slide-text{
    font-size:19px;
    line-height:1.65;
    margin:0;
    text-shadow:0 2px 18px rgba(0,0,0,.4);
    animation:slideIn .38s ease;
  }
  @keyframes slideIn{
    from{opacity:0; transform:translateX(26px);}
    to{opacity:1; transform:translateX(0);}
  }
  .slide-text.story-in{
    animation:storyIn .5s ease;
  }
  @keyframes storyIn{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  .slide-wrap.edge-bounce-left{animation:edgeBounceLeft .3s ease;}
  .slide-wrap.edge-bounce-right{animation:edgeBounceRight .3s ease;}
  @keyframes edgeBounceLeft{0%{transform:translateX(0);}45%{transform:translateX(16px);}100%{transform:translateX(0);}}
  @keyframes edgeBounceRight{0%{transform:translateX(0);}45%{transform:translateX(-16px);}100%{transform:translateX(0);}}

  /* side action rail — own column, never overlaps the text column */
  .action-rail{
    flex-shrink:0;
    width:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:19px;
    padding:0 10px 4px 0;
    position:relative;
    z-index:6;
  }
  .action-btn{
    background:none;border:none;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:0; font-family:var(--ui-body);
  }
  .action-btn svg{width:27px;height:27px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));transition:transform .15s ease;}
  .action-btn:active svg{transform:scale(.8);}
  .action-btn span{font-size:11px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);}
  .action-btn.liked svg{fill:#ea3d5c;stroke:#ea3d5c;}
  .action-btn.saved svg{fill:#fff;}
  .pulse{animation:pulseKey .3s ease;}
  @keyframes pulseKey{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}

  /* footer: profile row + swipe hint, own row below the content — never overlaps text or actions */
  .footer-zone{
    flex-shrink:0;
    padding:0 18px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
    z-index:6;
  }
  .profile-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ui-display);font-weight:800;font-size:13px;
    background:conic-gradient(from 220deg,#e9788c,#e6be6e,#59c3b4,#e9788c);
    color:#1a0e10;
    border:2px solid rgba(255,255,255,.75);
    flex-shrink:0;
  }
  .handle{
    font-weight:700;
    font-size:14px;
    text-shadow:0 1px 8px rgba(0,0,0,.5);
  }

  /* swipe hint */
  .swipe-hint{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.2px;
    color:rgba(255,255,255,.88);
    display:flex;
    align-items:center;
    gap:6px;
    text-shadow:0 1px 8px rgba(0,0,0,.5);
    min-height:16px;
  }
  .swipe-hint .chev{
    display:inline-block;
    animation:chevBounce 1.3s ease-in-out infinite;
  }
  @keyframes chevBounce{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(-5px);}
  }
  .swipe-hint.up .chev{animation:chevBounceUp 1.3s ease-in-out infinite;}
  @keyframes chevBounceUp{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }

  /* desktop arrows — 4-direction d-pad */
  .desktop-arrows{
    display:none;
    grid-template-columns:50px 50px 50px;
    grid-template-rows:50px 50px 50px;
    gap:8px;
  }
  @media (min-width:760px){
    .desktop-arrows{display:grid;}
  }
  .darrow{
    width:50px;height:50px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:#f2f0ee;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:all .15s ease;
  }
  .darrow:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);}
  .darrow:active{transform:scale(.92);}
  .darrow:disabled{opacity:.3;cursor:default;}
  .darrow:disabled:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15);}
  .darrow svg{width:21px;height:21px;}
  .darrow.up{grid-column:2;grid-row:1;}
  .darrow.left{grid-column:1;grid-row:2;}
  .darrow.right{grid-column:3;grid-row:2;}
  .darrow.down{grid-column:2;grid-row:3;}

  /* ================= GENRE THEMES ================= */
  .reel[data-genre="romance"]{
    background:
      radial-gradient(2px 2px at 18% 22%, rgba(255,214,224,.5), transparent),
      radial-gradient(1.5px 1.5px at 78% 15%, rgba(255,214,224,.4), transparent),
      radial-gradient(2px 2px at 60% 78%, rgba(230,190,110,.35), transparent),
      radial-gradient(1.5px 1.5px at 30% 85%, rgba(255,214,224,.35), transparent),
      radial-gradient(circle at 75% 90%, rgba(230,190,110,.10), transparent 45%),
      radial-gradient(circle at 25% 35%, rgba(255,175,195,.14), transparent 50%),
      radial-gradient(circle at 30% 0%,#6b2a3d,#2f121a 60%,#1c0a0f);
  }
  .reel[data-genre="romance"] .story-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:#ffd9e0;text-shadow:0 0 22px rgba(233,120,140,.5), 0 2px 14px rgba(0,0,0,.45);}
  .reel[data-genre="romance"] .slide-text{font-family:'Lora',serif;color:#fbeee7;}
  .reel[data-genre="romance"] .genre-pill{background:rgba(233,120,140,.28);color:#ffe1e7;}
  .reel[data-genre="romance"] .handle{color:#ffe1e7;}

  .reel[data-genre="comedy"]{
    background:
      radial-gradient(circle, rgba(255,255,255,.22) 1.4px, transparent 1.6px) 0 0/34px 34px,
      radial-gradient(circle at 90% 8%, rgba(255,255,255,.40), transparent 30%),
      radial-gradient(circle at 6% 92%, rgba(255,255,255,.20), transparent 34%),
      linear-gradient(155deg,#ffc93c 0%,#ff9a3c 48%,#f9564f 100%);
  }
  .reel[data-genre="comedy"]::before{
    background:linear-gradient(to bottom, rgba(255,255,255,.20) 0%, transparent 24%, transparent 58%, rgba(60,16,8,.30) 100%);
  }
  .reel[data-genre="comedy"] .story-title{
    font-family:'Poppins',sans-serif;
    font-style:italic;
    font-weight:800;
    color:#2a1305;
    text-shadow:0 2px 0 rgba(255,255,255,.55), 0 6px 16px rgba(60,16,8,.25);
  }
  .reel[data-genre="comedy"] .slide-text{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    color:#2a1305;
    text-shadow:0 1.5px 0 rgba(255,255,255,.45);
  }
  .reel[data-genre="comedy"] .genre-pill{background:rgba(255,255,255,.55);color:#8a2e10;}
  .reel[data-genre="comedy"] .handle{color:#2a1305;}
  .reel[data-genre="comedy"] .swipe-hint{color:rgba(40,16,4,.88);}
  .reel[data-genre="comedy"] .action-btn{color:#2a1305;}
  .reel[data-genre="comedy"] .action-btn svg{filter:none;}

  .reel[data-genre="fantasy"]{
    background:
      radial-gradient(1.5px 1.5px at 20% 20%, #fff, transparent),
      radial-gradient(1px 1px at 70% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 65%, #e6be6e, transparent),
      radial-gradient(1px 1px at 85% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 85%, #fff, transparent),
      radial-gradient(1px 1px at 10% 80%, #59c3b4, transparent),
      radial-gradient(1px 1px at 92% 40%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 5% 45%, #e6be6e, transparent),
      radial-gradient(circle at 50% 0%, #4a2680,#170a30 65%, #0e0620);
  }
  .reel[data-genre="fantasy"]::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(1.5px 1.5px at 25% 30%, #fff, transparent),
      radial-gradient(1px 1px at 65% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 22%, #e6be6e, transparent);
    animation:twinkle 3.4s ease-in-out infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes twinkle{0%,100%{opacity:.25;}50%{opacity:.95;}}
  .reel[data-genre="fantasy"] .story-title{font-family:'Cinzel',serif;font-weight:700;color:#e9d9a8;letter-spacing:.5px;text-shadow:0 0 18px rgba(233,190,110,.55), 0 2px 14px rgba(0,0,0,.5);}
  .reel[data-genre="fantasy"] .slide-text{font-family:'EB Garamond',serif;font-size:20px;color:#eee6f7;}
  .reel[data-genre="fantasy"] .genre-pill{background:rgba(217,180,92,.18);color:#e9d9a8;}
  .reel[data-genre="fantasy"] .handle{color:#e9d9a8;}

  .reel[data-genre="mystery"]{
    background:
      radial-gradient(ellipse at 50% 30%, rgba(150,170,200,.12), transparent 45%),
      radial-gradient(ellipse at 50% 40%, rgba(120,140,170,.10), transparent 55%),
      radial-gradient(ellipse at 50% 50%, #26262d 0%, #101012 75%, #060607 100%);
  }
  .reel[data-genre="mystery"]::after{
    content:"";
    position:absolute;inset:0;
    background:repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 0, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
    pointer-events:none;
    z-index:3;
  }
  .reel[data-genre="mystery"] .story-title{font-family:'Special Elite',cursive;font-weight:400;color:#d8b6ac;letter-spacing:.5px;text-shadow:0 0 20px rgba(140,160,190,.3), 0 2px 14px rgba(0,0,0,.6);}
  .reel[data-genre="mystery"] .slide-text{font-family:'IBM Plex Mono',monospace;color:#d9d6cf;font-size:16.5px;line-height:1.75;}
  .reel[data-genre="mystery"] .genre-pill{background:rgba(154,48,64,.28);color:#f0c9ce;}
  .reel[data-genre="mystery"] .handle{color:#e6e2d8;}

  /* on desktop the phone frame is smaller but the viewport is huge — the mobile-tuned
     font size left almost no breathing room, so trim it down and open up the padding */
  @media (min-width:760px){
    .slide-wrap{padding:6px 16px 6px 30px;}
    .slide-text{font-size:16.5px;}
    .reel[data-genre="fantasy"] .slide-text{font-size:17.5px;}
    .reel[data-genre="mystery"] .slide-text{font-size:15px;}
  }

  /* ================= END SCREEN ================= */
  #end-screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    background:radial-gradient(circle at 50% 30%, rgba(233,120,140,.15), transparent 50%), #0b0b0d;
    z-index:20;
  }
  #end-screen .e-icon{font-size:38px;margin-bottom:18px;}
  #end-screen h2{
    font-family:var(--ui-display);
    font-weight:700;
    font-size:22px;
    margin:0 0 10px;
  }
  #end-screen p{
    color:#a8a59d;
    font-size:14px;
    line-height:1.6;
    max-width:280px;
    margin:0 0 26px;
  }
  #restart-btn{
    padding:13px 32px;
    border-radius:30px;
    border:none;
    font-family:var(--ui-display);
    font-weight:700;
    font-size:14px;
    background:linear-gradient(100deg,#e9788c,#e6be6e);
    color:#1a0e10;
    cursor:pointer;
  }
  #restart-btn:active{transform:scale(.97);}
</style>
</head>
<body>

<div id="app">

  <!-- ============ GENRE SELECTION SCREEN ============ -->
  <div id="genre-screen">
    <h1 class="brand">reeltale</h1>
    <p class="brand-sub">Tiny stories, told one slide at a time. Pick what you're in the mood for.</p>
    <p class="genre-prompt">Choose your genres</p>
    <div class="genre-grid" id="genre-grid"></div>
    <p class="genre-status" id="genre-status">Loading stories…</p>
    <button id="start-btn">Start reading</button>
  </div>

  <!-- ============ MAIN REELS SCREEN ============ -->
  <div id="stage" class="hidden">
    <div class="phone-frame">
      <div class="reel" id="reel" data-genre="romance">
        <div class="reel-surface">
          <div class="progress-row" id="progress-row"></div>
          <div class="top-bar">
            <span class="genre-pill" id="genre-pill">Romance</span>
          </div>
          <h1 class="story-title" id="story-title">Title</h1>

          <div class="content-row">
            <div class="slide-wrap">
              <p class="slide-text" id="slide-text">Slide text</p>
            </div>
            <div class="action-rail">
              <button class="action-btn" id="like-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"></path></svg>
                <span id="like-count">2.4k</span>
              </button>
              <button class="action-btn" id="comment-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-1L3 20l1-5.5A8.5 8.5 0 1 1 21 11.5z"></path></svg>
                <span>318</span>
              </button>
              <button class="action-btn" id="share-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                <span>Share</span>
              </button>
              <button class="action-btn" id="save-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                <span>Save</span>
              </button>
            </div>
          </div>

          <div class="footer-zone">
            <div class="profile-row">
              <div class="avatar">PK</div>
              <span class="handle">pkthethug</span>
            </div>
            <div class="swipe-hint" id="swipe-hint"><span class="chev">‹</span> Swipe left to keep reading</div>
          </div>
        </div>
      </div>
    </div>
    <div class="desktop-arrows">
      <button class="darrow up" id="arrow-up" title="Previous story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
      </button>
      <button class="darrow left" id="arrow-left" title="Previous slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="darrow right" id="arrow-right" title="Next slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <button class="darrow down" id="arrow-down" title="Next story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>

    <!-- ============ END OF STORIES SCREEN ============ -->
    <div id="end-screen" class="hidden">
      <div class="e-icon">📖</div>
      <h2>That's all for now</h2>
      <p>You've reached the end of today's stories. Keep coming back for more.</p>
      <button id="restart-btn">Choose genres again</button>
    </div>
  </div>

</div>

<script>
// ================= CONFIG =================
const STORY_FOLDER = 'Story-JSONs/';
const GENRE_META = {
  romance: {icon:'💌', tag:'slow, tender'},
  comedy:  {icon:'😂', tag:'quick, absurd'},
  fantasy: {icon:'🔮', tag:'myth, magic'},
  mystery: {icon:'🕵️', tag:'dark, unsolved'}
};
const DEFAULT_META = {icon:'📖', tag:'flash fiction'};
const GENRE_ORDER = ['romance','comedy','fantasy','mystery'];

// ================= STATE =================
let ALL_STORIES = [];
let queue = [];
let storyIndex = 0;
let slideIndex = 0;
let likeCounts = {};

// ================= DOM =================
const genreScreen = document.getElementById('genre-screen');
const genreGrid = document.getElementById('genre-grid');
const genreStatus = document.getElementById('genre-status');
const startBtn = document.getElementById('start-btn');
const stage = document.getElementById('stage');
const reel = document.getElementById('reel');
const genrePill = document.getElementById('genre-pill');
const storyTitleEl = document.getElementById('story-title');
const slideTextEl = document.getElementById('slide-text');
const progressRow = document.getElementById('progress-row');
const swipeHint = document.getElementById('swipe-hint');
const endScreen = document.getElementById('end-screen');
const likeBtn = document.getElementById('like-btn');
const likeCountEl = document.getElementById('like-count');
const commentBtn = document.getElementById('comment-btn');
const shareBtn = document.getElementById('share-btn');
const saveBtn = document.getElementById('save-btn');
const arrowUp = document.getElementById('arrow-up');
const arrowDown = document.getElementById('arrow-down');
const arrowLeft = document.getElementById('arrow-left');
const arrowRight = document.getElementById('arrow-right');
const restartBtn = document.getElementById('restart-btn');

// ================= LOAD STORIES FROM /Story-JSONs =================
// Browsers can't list a folder's contents directly, so we try two strategies:
//  1) Ask the folder itself for an HTML directory listing (works out of the box
//     with simple local servers like `python -m http.server`).
//  2) Fall back to Story-JSONs/manifest.json — a plain array of filenames.
//     This is the reliable option for servers that don't expose listings
//     (most static hosts). Add new files there when strategy 1 doesn't apply.
async function discoverFilenames(){
  try{
    const res = await fetch(STORY_FOLDER, {cache:'no-store'});
    if (res.ok){
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('html')){
        const html = await res.text();
        const found = [...html.matchAll(/href="([^"?#]+\.json)"/gi)]
          .map(m => decodeURIComponent(m[1]).split('/').pop())
          .filter(f => f.toLowerCase() !== 'manifest.json');
        if (found.length) return [...new Set(found)];
      }
    }
  } catch(e){ /* directory listing not available, fall through */ }

  try{
    const res = await fetch(STORY_FOLDER + 'manifest.json', {cache:'no-store'});
    if (res.ok){
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.files || []);
      if (list.length) return list;
    }
  } catch(e){ /* no manifest either */ }

  return [];
}

function normalizeStory(data, fname){
  if (!data || !Array.isArray(data.slides) || !data.slides.length) return null;
  const slides = data.slides
    .map(s => typeof s === 'string' ? s : (s && s.text) || '')
    .filter(Boolean);
  if (!slides.length) return null;
  return {
    id: data.id || fname.replace(/\.json$/i, ''),
    genre: String(data.genre || 'story').toLowerCase().trim(),
    title: data.title || 'Untitled',
    slides
  };
}

async function loadStories(){
  const filenames = await discoverFilenames();
  const stories = [];
  for (const fname of filenames){
    try{
      const res = await fetch(STORY_FOLDER + fname, {cache:'no-store'});
      if (!res.ok) continue;
      const data = await res.json();
      const story = normalizeStory(data, fname);
      if (story) stories.push(story);
    } catch(e){ console.warn('Could not load story file:', fname, e); }
  }
  return stories;
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function buildGenreGrid(){
  const genres = [...new Set(ALL_STORIES.map(s => s.genre))];
  genres.sort((a,b) => {
    const ia = GENRE_ORDER.indexOf(a), ib = GENRE_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  genreGrid.innerHTML = '';
  genres.forEach(g => {
    const meta = GENRE_META[g] || DEFAULT_META;
    const card = document.createElement('div');
    card.className = 'genre-card';
    card.dataset.g = g;
    card.innerHTML =
      '<span class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>' +
      '<span class="g-icon">' + meta.icon + '</span>' +
      '<span class="g-name">' + capitalize(g) + '</span>' +
      '<span class="g-tag">' + meta.tag + '</span>';
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      const anySelected = genreGrid.querySelectorAll('.genre-card.selected').length > 0;
      startBtn.classList.toggle('ready', anySelected);
    });
    genreGrid.appendChild(card);
  });
}

async function init(){
  genreStatus.textContent = 'Loading stories…';
  genreStatus.classList.remove('error');
  try{
    ALL_STORIES = await loadStories();
  } catch(e){
    console.error(e);
    ALL_STORIES = [];
  }

  if (!ALL_STORIES.length){
    genreStatus.classList.add('error');
    genreStatus.innerHTML = 'No stories found. Add JSON files to the <code>Story-JSONs</code> folder next to this HTML file (and serve it through a local server, not by double-clicking it).';
    return;
  }

  buildGenreGrid();
  genreStatus.textContent = '';
}

init();

startBtn.addEventListener('click', () => {
  if (!startBtn.classList.contains('ready')) return;
  const selected = Array.from(genreGrid.querySelectorAll('.genre-card.selected')).map(c => c.dataset.g);
  queue = ALL_STORIES.filter(s => selected.includes(s.genre));
  shuffle(queue);
  storyIndex = 0;
  slideIndex = 0;
  likeCounts = {};
  genreScreen.classList.add('hidden');
  stage.classList.remove('hidden');
  endScreen.classList.add('hidden');
  render(true);
});

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ================= RENDER =================
function render(isNewStory){
  if (storyIndex >= queue.length){
    showEnd();
    return;
  }
  const story = queue[storyIndex];
  reel.dataset.genre = story.genre;
  genrePill.textContent = capitalize(story.genre);
  storyTitleEl.textContent = story.title;
  slideTextEl.textContent = story.slides[slideIndex];
  slideTextEl.classList.remove('slide-text','story-in');
  void slideTextEl.offsetWidth; // restart animation
  slideTextEl.className = 'slide-text ' + (isNewStory ? 'story-in' : '');
  slideTextEl.parentElement.scrollTop = 0;

  // progress segments
  progressRow.innerHTML = '';
  story.slides.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    const fill = document.createElement('i');
    fill.style.width = (i <= slideIndex ? '100%' : '0%');
    seg.appendChild(fill);
    progressRow.appendChild(seg);
  });

  // like state per story (placeholder, resets visual per story)
  const baseLikes = 1000 + (story.title.length * 137) % 4000;
  likeBtn.classList.remove('liked');
  likeCountEl.textContent = formatCount(likeCounts[story.id] || baseLikes);

  // swipe hint
  const hasMoreSlides = slideIndex < story.slides.length - 1;
  const hasMoreStories = storyIndex < queue.length - 1;
  swipeHint.classList.remove('up');
  if (hasMoreSlides){
    swipeHint.innerHTML = '<span class="chev">‹</span> Swipe left to keep reading';
  } else if (hasMoreStories){
    swipeHint.classList.add('up');
    swipeHint.innerHTML = '<span class="chev">^</span> Swipe up for the next story';
  } else {
    swipeHint.innerHTML = '';
  }

  // desktop arrow enabled state — left/right only move within the current story now
  arrowLeft.disabled = (slideIndex === 0);
  arrowRight.disabled = (slideIndex === story.slides.length - 1);
  arrowUp.disabled = (storyIndex === 0);
}

function formatCount(n){
  return n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n);
}

function showEnd(){
  endScreen.classList.remove('hidden');
}

// ================= NAVIGATION =================
function nextSlide(){
  const story = queue[storyIndex];
  if (!story) return;
  if (slideIndex < story.slides.length - 1){
    slideIndex++;
    render(false);
  } else {
    edgeBounce('right'); // last slide of the story — left/right no longer changes stories
  }
}

function prevSlide(){
  if (slideIndex > 0){
    slideIndex--;
    render(false);
  } else {
    edgeBounce('left'); // first slide of the story — left/right no longer changes stories
  }
}

function edgeBounce(dir){
  const wrap = slideTextEl.parentElement;
  wrap.classList.remove('edge-bounce-left','edge-bounce-right');
  void wrap.offsetWidth; // restart animation
  wrap.classList.add(dir === 'left' ? 'edge-bounce-left' : 'edge-bounce-right');
}

function nextStory(){
  if (storyIndex < queue.length - 1){
    storyIndex++;
    slideIndex = 0;
    render(true);
  } else {
    storyIndex = queue.length;
    showEnd();
  }
}

function prevStory(){
  if (storyIndex > 0){
    storyIndex--;
    slideIndex = 0;
    render(true);
  }
}

// ================= TOUCH HANDLING (all 4 directions) =================
let touchStartX = 0, touchStartY = 0, touchActive = false;
const SWIPE_THRESHOLD = 45;

reel.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchActive = true;
}, {passive:true});

reel.addEventListener('touchend', (e) => {
  if (!touchActive) return;
  touchActive = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (absX < 30 && absY < 30) return; // tap, ignore

  if (absX > absY){
    if (dx < -SWIPE_THRESHOLD) nextSlide();
    else if (dx > SWIPE_THRESHOLD) prevSlide();
  } else {
    if (dy < -SWIPE_THRESHOLD) nextStory();
    else if (dy > SWIPE_THRESHOLD) prevStory();
  }
}, {passive:true});

// ================= DESKTOP ARROWS + KEYBOARD (all 4 directions) =================
arrowRight.addEventListener('click', nextSlide);
arrowLeft.addEventListener('click', prevSlide);
arrowDown.addEventListener('click', nextStory);
arrowUp.addEventListener('click', prevStory);

document.addEventListener('keydown', (e) => {
  if (stage.classList.contains('hidden')) return;
  if (e.key === 'ArrowRight') nextSlide();
  else if (e.key === 'ArrowLeft') prevSlide();
  else if (e.key === 'ArrowDown') nextStory();
  else if (e.key === 'ArrowUp') prevStory();
});

// ================= PLACEHOLDER ACTION BUTTONS =================
likeBtn.addEventListener('click', () => {
  const story = queue[storyIndex];
  const isLiked = likeBtn.classList.toggle('liked');
  const baseLikes = 1000 + (story.title.length * 137) % 4000;
  const current = likeCounts[story.id] || baseLikes;
  likeCounts[story.id] = isLiked ? current + 1 : current - 1;
  likeCountEl.textContent = formatCount(likeCounts[story.id]);
  pulse(likeBtn);
});
commentBtn.addEventListener('click', () => pulse(commentBtn));
shareBtn.addEventListener('click', () => pulse(shareBtn));
saveBtn.addEventListener('click', () => {
  saveBtn.classList.toggle('saved');
  pulse(saveBtn);
});

function pulse(el){
  el.querySelector('svg').classList.add('pulse');
  setTimeout(() => el.querySelector('svg').classList.remove('pulse'), 300);
}

// ================= RESTART =================
restartBtn.addEventListener('click', () => {
  genreGrid.querySelectorAll('.genre-card.selected').forEach(c => c.classList.remove('selected'));
  startBtn.classList.remove('ready');
  stage.classList.add('hidden');
  endScreen.classList.add('hidden');
  genreScreen.classList.remove('hidden');
});
</script>
</body>
</html>
